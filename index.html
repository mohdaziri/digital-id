/* ═══════════ Utiliti ═══════════ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const b64u = {
  enc(buf) { let s = ''; for (const x of new Uint8Array(buf)) s += String.fromCharCode(x);
             return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '=';
             const s = atob(str), b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b.buffer; }
};
const store = {
  get(k, s) { try { return (s ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } },
  set(k, v, s) { try { (s ? sessionStorage : localStorage).setItem(k, v); } catch (e) {} },
  del(k, s) { try { (s ? sessionStorage : localStorage).removeItem(k); } catch (e) {} }
};

/* ═══════════ API ═══════════ */
async function api(action, body = {}) {
  let res;
  try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...body }) }); }
  catch (e) { throw new Error('Tidak dapat menghubungi pelayan. Semak sambungan internet.'); }
  const j = await res.json();
  if (!j.ok) {
    if (/Sesi tamat/.test(j.error) && S.me) { logout(j.error); }
    throw new Error(j.error);
  }
  return j.data;
}
const authed = (action, body = {}) => api(action, { sessionToken: S.token, ...body });

/* ═══════════ Toast, Modal, Menu ═══════════ */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  const tone = type === 'err' ? 'text-rose-600' : 'text-emerald-600';
  el.className = 'pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-xl bg-white p-4 shadow-lg ring-1 ring-slate-200 transition duration-300 translate-y-2 opacity-0';
  el.innerHTML = `<span class="${tone}">${ico(type === 'err' ? 'x' : 'check')}</span><p class="text-sm text-slate-700">${esc(msg)}</p>`;
  $('#toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));
  setTimeout(() => { el.classList.add('opacity-0'); setTimeout(() => el.remove(), 300); }, type === 'err' ? 6000 : 3500);
}

const modalStack = [];
function openModal(html, { size = 'md', onClose, dismissable = true } = {}) {
  const sizes = { sm: 'sm:max-w-sm', md: 'sm:max-w-lg', lg: 'sm:max-w-2xl' };
  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4';
  wrap.innerHTML = `<div data-bd class="absolute inset-0 bg-slate-900/40 opacity-0 backdrop-blur-[2px] transition"></div>
    <div data-panel role="dialog" aria-modal="true" class="relative max-h-[92vh] w-full ${sizes[size]} translate-y-4 overflow-y-auto rounded-t-2xl bg-white opacity-0 shadow-xl ring-1 ring-slate-200 transition sm:rounded-2xl">${html}</div>`;
  document.body.appendChild(wrap);
  const panel = $('[data-panel]', wrap), bd = $('[data-bd]', wrap);
  requestAnimationFrame(() => { bd.classList.remove('opacity-0'); panel.classList.remove('translate-y-4', 'opacity-0'); });
  let closed = false;
  const m = {
    el: wrap, q: s => $(s, wrap),
    close(fromUser) {
      if (closed) return; closed = true;
      bd.classList.add('opacity-0'); panel.classList.add('translate-y-4', 'opacity-0');
      setTimeout(() => wrap.remove(), 160);
      modalStack.splice(modalStack.indexOf(m), 1);
      if (fromUser && onClose) onClose();
    },
    dismissable
  };
  if (dismissable) bd.onclick = () => m.close(true);
  $$('[data-close]', wrap).forEach(b => b.onclick = () => m.close(true));
  modalStack.push(m);
  setTimeout(() => { const f = $('input:not([type=checkbox]):not([disabled]),select', panel); if (f && window.innerWidth > 640) f.focus(); }, 60);
  return m;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); const m = modalStack[modalStack.length - 1]; if (m && m.dismissable) m.close(true); } });

const modalHead = (title, sub) => `<div class="flex items-start justify-between gap-4 border-b border-slate-100 px-6 py-4">

const modalFoot = inner => `<div class="flex flex-col-reverse gap-2 border-t border-slate-100 bg-slate-50/60 px-6 py-4 sm:flex-row sm:justify-end">${inner}</div>`;

function confirmDialog({ title, message, confirmText = 'Teruskan', danger = false }) {
  return new Promise(res => {
    const m = openModal(`<div class="p-6"><div class="flex gap-4">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full ${danger ? 'bg-rose-50 text-rose-600' : 'bg-indigo-50 text-indigo-600'}">${ico(danger ? 'trash' : 'shield')}</div>

  });
}

function closeMenu() { const m = $('#ctxMenu'); if (m) m.remove(); }
function openMenu(anchor, items) {
  closeMenu();
  const r = anchor.getBoundingClientRect();
  const m = document.createElement('div');
  m.id = 'ctxMenu';
  m.className = 'fixed z-40 w-56 rounded-xl bg-white py-1.5 shadow-lg ring-1 ring-slate-200';
  m.innerHTML = items.filter(Boolean).map((it, i) => it === '-' ? '<div class="my-1 border-t border-slate-100"></div>' :
    `<button data-i="${i}" ${it.disabled ? 'disabled' : ''} class="flex w-full items-center gap-2.5 px-3.5 py-2 text-left text-sm ${it.danger ? 'text-rose-600 hover:bg-rose-50' : 'text-slate-700 hover:bg-slate-50'} disabled:opacity-40">${ico(it.icon, 'h-4 w-4')}${esc(it.label)}</button>`).join('');
  document.body.appendChild(m);
  const h = m.offsetHeight, top = r.bottom + h + 8 > window.innerHeight ? r.top - h - 4 : r.bottom + 4;
  m.style.top = Math.max(8, top) + 'px';
  m.style.left = Math.max(8, Math.min(r.right - 224, window.innerWidth - 232)) + 'px';
  const list = items.filter(Boolean);
  $$('[data-i]', m).forEach(b => b.onclick = e => { e.stopPropagation(); closeMenu(); list[b.dataset.i].onClick(); });
  setTimeout(() => document.addEventListener('click', closeMenu, { once: true }), 0);
}
window.addEventListener('scroll', closeMenu, true);
window.addEventListener('resize', closeMenu);

async function busy(btnEl, fn) {
  const html = btnEl.innerHTML; btnEl.disabled = true;
  btnEl.innerHTML = `<svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>${btnEl.textContent.trim() ? 'Sila tunggu…' : ''}`;
  try { return await fn(); } finally { btnEl.disabled = false; btnEl.innerHTML = html; }
}

function webauthnError(e) {
  if (e.name === 'NotAllowedError') return 'Pengesahan dibatalkan atau tamat masa.';
  if (e.name === 'InvalidStateError') return 'Peranti ini sudah didaftarkan untuk akaun ini.';
  if (e.name === 'SecurityError') return 'Ralat keselamatan: semak RP_ID / ORIGIN dalam Config sama dengan domain portal.';
  return e.message || String(e);
}
function deviceLabel() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone'; if (/iPad/.test(ua)) return 'iPad';
  const m = ua.match(/Android[^;]*;\s*([^;)]+)/); if (m) return 'Android ' + m[1].replace(/Build.*/, '').trim();
  return /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'Peranti';
}

/* ═══════════ Pengesahan cap jari (2 langkah: ringkasan → imbas, sesuai Safari iOS) ═══════════ */
async function biometric(purpose, params) {
  const start = await api('authStart', { purpose, ...params });
  const s = start.summary;
  return new Promise((resolve, reject) => {
    const detail = s.title
      ? `<div class="mt-4 rounded-xl bg-slate-50 p-4 text-left ring-1 ring-slate-200">
           <p class="text-sm font-medium text-slate-900">${esc(s.title)}</p>
           <p class="mt-2 break-all font-mono text-[11px] leading-relaxed text-slate-500">SHA-256 · ${esc(s.docHash)}</p></div>
         <p class="mt-3 text-xs text-slate-500">Dengan mengimbas cap jari, anda bersetuju menandatangani dokumen ini secara digital.</p>`
      : `<p class="mt-1 text-sm text-slate-500">${esc(s.at || 'Sahkan identiti anda untuk meneruskan')}</p>`;
    const m = openModal(`<div class="px-6 pb-6 pt-8 text-center">
        <div class="fp-pulse mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">${ico('finger', 'h-10 w-10')}</div>
        <h3 class="mt-5 text-lg font-semibold text-slate-900">${esc(s.label)}</h3>${detail}
        <div class="mt-6 grid gap-2">
          ${btn('primary', ico('finger') + 'Imbas cap jari / Face ID', 'data-go')}
          ${btn('ghost', 'Batal', 'data-close')}
        </div></div>`, { size: 'sm', onClose: () => reject(new Error('Dibatalkan.')) });

    m.q('[data-go]').onclick = async () => {
      const pk = start.publicKey;
      let a;
      try {
        a = await navigator.credentials.get({ publicKey: {
          challenge: b64u.dec(pk.challenge), rpId: pk.rpId, timeout: pk.timeout, userVerification: pk.userVerification,
          // transports tidak dihadkan → di PC, browser boleh paparkan kod QR untuk imbas dengan telefon berdaftar
          allowCredentials: pk.allowCredentials.map(c => ({ type: 'public-key', id: b64u.dec(c.id) }))
        }});
      } catch (e) { m.close(); return reject(new Error(webauthnError(e))); }
      await busy(m.q('[data-go]'), async () => {
        try {
          const out = await api('authFinish', { challengeId: start.challengeId, credential: {
            id: a.id, clientDataJSON: b64u.enc(a.response.clientDataJSON),
            authenticatorData: b64u.enc(a.response.authenticatorData), signature: b64u.enc(a.response.signature) } });
          m.close(); resolve(out);
        } catch (e) { m.close(); reject(e); }
      });
    };
  });
}

/* ═══════════ Google Sign-In (SSO) ═══════════ */
let gisLoad = null, gisInit = false, gisHandler = null;
function loadGis() {
  if (!S.cfg.googleClientId) return Promise.resolve(false);
  if (!gisLoad) gisLoad = new Promise(res => {
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    sc.onload = () => res(true); sc.onerror = () => res(false);
    document.head.appendChild(sc);
  });
  return gisLoad;
}
/** Papar butang Google dalam elemen `el`. handler(idToken) dipanggil selepas pengguna memilih akaun. */
async function mountGoogle(el, handler, { oneTap = false, text = 'continue_with' } = {}) {
  if (!el || !(await loadGis()) || !window.google) return false;
  gisHandler = handler;
  if (!gisInit) {
    google.accounts.id.initialize({ client_id: S.cfg.googleClientId, callback: r => gisHandler && gisHandler(r.credential),
      auto_select: true, use_fedcm_for_prompt: true, context: 'signin', itp_support: true });
    gisInit = true;
  }
  google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', shape: 'pill', text, logo_alignment: 'center',
    width: Math.min(Math.max(el.offsetWidth, 240), 400), locale: 'ms' });
  if (oneTap) google.accounts.id.prompt();   // "Teruskan sebagai …" jika pengguna sudah log masuk Google
  return true;
}

/** SSO: Google beri emel → semak dalam Sheet → terus minta cap jari */
async function onGoogleLogin(idToken) {
  showAlert('lgMsg');
  const hello = $('#ssoHello');
  hello.className = 'mt-5 flex items-center gap-3 rounded-xl bg-slate-50 p-3 ring-1 ring-slate-200';
  hello.innerHTML = `<div class="skeleton h-9 w-9 rounded-full"></div><div class="flex-1 space-y-2"><div class="skeleton h-3 w-32 rounded"></div><div class="skeleton h-3 w-44 rounded"></div></div>`;
  try {
    const r = await api('ssoCheck', { idToken });
    if (!r.found) {
      hello.classList.add('hidden');
      return showAlert('lgMsg', `Emel ${r.email} tiada dalam sistem. Hubungi pentadbir untuk didaftarkan.`);
    }
    hello.innerHTML = `${avatar(r.name)}<div class="min-w-0"><p class="truncate text-sm font-medium text-slate-900">Hai, ${esc(r.name)}</p>
      <p class="truncate text-xs text-slate-500">${esc(r.email)} · ${esc(r.staffId)}</p></div><span class="ml-auto text-emerald-600">${ico('check')}</span>`;
    store.set('lastEmail', r.email);
    if (!r.registered) {
      return showAlert('lgMsg', 'Akaun anda belum mendaftar cap jari. Semak emel untuk link pendaftaran' +
        (r.role === 'ADMIN' ? ', atau log masuk admin dengan kata laluan di bawah.' : ', atau minta pentadbir menghantarnya semula.'));
    }
    await doLogin({ idToken });                 // kotak cap jari muncul serta-merta
  } catch (e) { hello.classList.add('hidden'); showAlert('lgMsg', e.message); }
}

async function doLogin(params, btnEl) {
  showAlert('lgMsg');
  const run = async () => {
    try { finishLogin(await biometric('LOGIN', params)); }
    catch (e) { if (e.message !== 'Dibatalkan.') showAlert('lgMsg', e.message); }
  };
  return btnEl ? busy(btnEl, run) : run();
}

function finishLogin(out) {
  store.set('session', out.sessionToken, true);
  S.token = out.sessionToken; S.me = out.staff;
  if (location.hash && location.hash !== '#/home') location.hash = '#/home';
  renderShell();
}

/* ═══════════ Phase 1: Pendaftaran (sekali sahaja) ═══════════ */
const REG = { step: 1, email: '', masked: '', opts: null };
function renderRegister() {
  const steps = ['Emel', 'Pengesahan', 'Cap jari'];
  const bar = REG.step <= 3 ? `<ol class="mb-6 flex items-center gap-2">${steps.map((t, i) => {
      const n = i + 1, done = n < REG.step, cur = n === REG.step;
      return `<li class="flex flex-1 items-center gap-2"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-semibold ${done ? 'bg-indigo-600 text-white' : cur ? 'bg-indigo-50 text-indigo-700 ring-2 ring-indigo-600' : 'bg-slate-100 text-slate-400'}">${done ? ico('check', 'h-4 w-4') : n}</span>
        <span class="hidden text-xs font-medium sm:inline ${cur ? 'text-slate-900' : 'text-slate-400'}">${t}</span>${n < 3 ? '<span class="h-px flex-1 bg-slate-200"></span>' : ''}</li>`; }).join('')}</ol>` : '';
  const g = !!S.cfg.googleClientId;

  let body = '';
  if (REG.step === 1) body = `<h2 class="text-lg font-semibold">Pendaftaran Digital ID</h2>
    <p class="mt-1 text-sm text-slate-500">Sahkan emel rasmi anda untuk mula mendaftar.</p>
    ${g ? `<div id="gReg" class="mt-6 flex min-h-[44px] w-full justify-center"></div>
      <p class="mt-2 text-center text-xs text-slate-400">Paling cepat — tiada kod perlu ditaip</p>
      <div class="my-5 flex items-center gap-3 text-xs text-slate-400"><span class="h-px flex-1 bg-slate-200"></span>atau guna kod emel<span class="h-px flex-1 bg-slate-200"></span></div>` : ''}
    <form id="rf" class="${g ? '' : 'mt-6'} space-y-4"><div><label class="${C.label}">Emel rasmi</label>
      <input id="rgEmail" type="email" class="${C.input}" placeholder="nama@organisasi.gov.my" autocomplete="email" required value="${esc(REG.email)}"></div>
      <button class="${C.btn} ${g ? C.secondary : C.primary} w-full py-3">${ico('mail')}Hantar kod pengesahan</button></form>`;
  if (REG.step === 2) body = `<h2 class="text-lg font-semibold">Masukkan kod</h2>
    <p class="mt-1 text-sm text-slate-500">Kod 6 digit telah dihantar ke <b class="text-slate-700">${esc(REG.masked)}</b>.</p>
    <form id="rf" class="mt-6 space-y-4"><div><label class="${C.label}">Kod pengesahan</label>
      <input id="rgOtp" class="${C.input} text-center font-mono text-2xl tracking-[.5em]" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" required></div>
      <button class="${C.btn} ${C.primary} w-full py-3">Sahkan kod</button></form>
    <button id="rgResend" class="${C.btn} ${C.ghost} mt-2 w-full">Hantar semula kod</button>`;
  if (REG.step === 3) body = `<div class="text-center"><div class="fp-pulse mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">${ico('finger', 'h-10 w-10')}</div>
    <h2 class="mt-5 text-lg font-semibold">Daftar cap jari / Face ID</h2>
    <p class="mt-2 text-sm text-slate-500">Hai <b class="text-slate-700">${esc(REG.opts.user.displayName)}</b>. Tekan butang di bawah dan imbas cap jari atau Face ID apabila telefon meminta.</p>
    <button id="rgPasskey" class="${C.btn} ${C.primary} mt-6 w-full py-3">${ico('finger')}Register Biometric / Passkey</button></div>`;
  if (REG.step === 4) body = `<div class="text-center"><div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-50 text-emerald-600">${ico('check', 'h-8 w-8')}</div>
    <h2 class="mt-5 text-lg font-semibold">Pendaftaran berjaya</h2>
    <p class="mt-2 text-sm text-slate-500">Cap jari anda telah dikaitkan dengan <b class="text-slate-700">${esc(REG.email)}</b>. Mulai sekarang, log masuk hanya perlukan cap jari — tiada kata laluan.</p>
    <button id="rgDone" class="${C.btn} ${C.primary} mt-6 w-full py-3">Log masuk sekarang</button></div>`;
  authLayout(bar + body + alertBox('rgMsg'));

  const sendOtp = b => busy(b, async () => {
    try { const r = await api('regStart', { token: regToken, email: REG.email }); REG.masked = r.maskedEmail;
      const resend = REG.step === 2; REG.step = 2; renderRegister(); if (resend) showAlert('rgMsg', 'Kod baharu telah dihantar.', true);
    } catch (e) { showAlert('rgMsg', e.message); }
  });
  if (REG.step === 1) {
    $('#rf').onsubmit = e => { e.preventDefault(); REG.email = $('#rgEmail').value.trim().toLowerCase(); sendOtp($('#rf button')); };
    if (g) mountGoogle($('#gReg'), async idToken => {
      showAlert('rgMsg');
      try { REG.opts = await api('regVerifyGoogle', { token: regToken, idToken }); REG.email = REG.opts.user.name; REG.step = 3; renderRegister(); }
      catch (err) { showAlert('rgMsg', err.message); }
    }, { text: 'continue_with' });
  }
  if (REG.step === 2) {
    $('#rgResend').onclick = e => sendOtp(e.currentTarget);
    $('#rf').onsubmit = e => { e.preventDefault(); busy($('#rf button'), async () => {
      try { REG.opts = await api('regVerifyOtp', { token: regToken, email: REG.email, otp: $('#rgOtp').value }); REG.step = 3; renderRegister(); }
      catch (err) { showAlert('rgMsg', err.message); } }); };
  }
  if (REG.step === 3) $('#rgPasskey').onclick = async e => {
    const b = e.currentTarget, o = REG.opts;
    showAlert('rgMsg');
    let cred;
    try {   // dipanggil terus dari klik — keperluan "user gesture" Safari iOS
      cred = await navigator.credentials.create({ publicKey: {
        challenge: b64u.dec(o.challenge), rp: o.rp,
        user: { id: b64u.dec(o.user.id), name: o.user.name, displayName: o.user.displayName },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        // residentKey "required" → passkey boleh dicari, jadi log masuk tidak perlu taip ID/emel
        authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'required', requireResidentKey: true, userVerification: 'required' },
        attestation: 'none', timeout: 60000,
        excludeCredentials: o.excludeCredentials.map(c => ({ type: 'public-key', id: b64u.dec(c.id) }))
      }});
    } catch (err) { return showAlert('rgMsg', webauthnError(err)); }
    const r = cred.response;
    if (!r.getPublicKey || !r.getAuthenticatorData) return showAlert('rgMsg', 'Browser terlalu lama. Sila kemas kini browser anda.');
    busy(b, async () => {
      try {
        await api('regFinish', { token: regToken, email: REG.email, deviceLabel: deviceLabel(), credential: {
          id: cred.id, rawId: b64u.enc(cred.rawId), clientDataJSON: b64u.enc(r.clientDataJSON),
          authenticatorData: b64u.enc(r.getAuthenticatorData()), publicKey: b64u.enc(r.getPublicKey()),
          publicKeyAlg: r.getPublicKeyAlgorithm(), transports: r.getTransports ? r.getTransports() : [] } });
        store.set('lastEmail', REG.email); REG.step = 4; renderRegister();
      } catch (err) { showAlert('rgMsg', err.message); }
    });
  };
  if (REG.step === 4) $('#rgDone').onclick = () => { history.replaceState(null, '', location.pathname); renderLogin(); };
}

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">${'<div class="skeleton h-28 rounded-2xl"></div>'.repeat(4)}</div><div class="skeleton h-72 rounded-2xl"></div></div>`;

const searchBox = (id, ph) => `<div class="relative flex-1"><span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">${ico('search', 'h-4 w-4')}</span>
  <input id="${id}" class="${C.input} pl-9" placeholder="${ph}"></div>`;

async function renderPage() {
  closeMenu();
  paintNav();
  const main = $('#main'); if (!main) return;
  const seq = ++S.seq;
  main.innerHTML = skeleton();
  window.scrollTo(0, 0);
  const view = { live: () => seq === S.seq, set: html => { if (seq === S.seq) main.innerHTML = html; return seq === S.seq; } };
  try { await PAGES[currentRoute()](view); }
  catch (e) { if (S.me) view.set(`<div class="${C.card}">${emptyState('x', 'Gagal memuatkan', esc(e.message))}</div>`); }
}

      const out = await biometric('ATTENDANCE', { sessionToken: S.token, type: b.dataset.att, ...geo });
      toast(`${out.type === 'IN' ? 'Daftar masuk' : 'Daftar keluar'} direkod pada ${out.time.slice(11, 16)}`);
      renderPage();
    } catch (e) { if (e.message !== 'Dibatalkan.') toast(e.message, 'err'); }
  }));
  $$('[data-sign]').forEach(b => b.onclick = () => busy(b, async () => {
    try {
      const out = await biometric('SIGN', { sessionToken: S.token, docId: b.dataset.sign });
      toast(`“${out.title}” ditandatangani · ${out.receiptId}`); renderPage();
    } catch (e) { if (e.message !== 'Dibatalkan.') toast(e.message, 'err'); }

};
function getGeo() {
  return new Promise(res => {
    const el = $('#useGeo');
    if (!el || !el.checked || !navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res({}), { timeout: 8000 });
  });
}

function userMenu(anchor, u) {
  const self = u.id === S.me.id;
  openMenu(anchor, [
    { label: 'Edit maklumat', icon: 'edit', onClick: () => userForm(u) },
    { label: u.status === 'ACTIVE' ? 'Hantar link tambah peranti' : u.status === 'INVITED' ? 'Hantar semula link' : 'Hantar link pendaftaran',
      icon: 'mail', disabled: u.status === 'DISABLED', onClick: () => userAction(u, 'SEND_LINK') },
    { label: 'Batal semua passkey', icon: 'key', disabled: self || !u.devices.length, onClick: () => userAction(u, 'REVOKE') },
    u.status === 'DISABLED' ? { label: 'Aktifkan semula', icon: 'play', onClick: () => userAction(u, 'ENABLE') }
      : { label: 'Nyahaktifkan', icon: 'ban', disabled: self, onClick: () => userAction(u, 'DISABLE') },
    '-',
    { label: 'Padam pengguna', icon: 'trash', danger: true, disabled: self, onClick: () => userAction(u, 'DELETE') }
  ]);
}

const CONFIRMS = {
  REVOKE: u => ({ title: 'Batal semua passkey?', message: `${u.name} tidak akan dapat log masuk sehingga mendaftar semula. Gunakan jika telefon hilang atau ditukar.`, confirmText: 'Batal passkey', danger: true }),
  DISABLE: u => ({ title: 'Nyahaktifkan pengguna?', message: `${u.name} tidak boleh log masuk, merekod kehadiran atau menandatangani. Rekod sedia ada dikekalkan.`, confirmText: 'Nyahaktifkan', danger: true }),
  DELETE: u => ({ title: 'Padam pengguna?', message: `Akaun ${u.name} (${u.id}) akan dipadam dan passkey dibatalkan. Rekod kehadiran & tandatangan lama dikekalkan untuk audit. Tindakan ini tidak boleh dibatalkan.`, confirmText: 'Padam', danger: true })
};
async function userAction(u, op) {
  if (CONFIRMS[op] && !(await confirmDialog(CONFIRMS[op](u)))) return;
  try {
    const r = await authed('adminUserAction', { staffId: u.id, op });
    if (r.link) showLinkModal(u, r.link); else toast(r.message);
    renderPage();
  } catch (e) { toast(e.message, 'err'); }
}

function showLinkModal(u, link) {
  const m = openModal(`${modalHead('Link pendaftaran dihantar', 'Emel telah dihantar kepada ' + u.email)}
    <div class="px-6 py-5"><p class="text-sm text-slate-600">Link ini sekali guna dan juga dihantar melalui emel. Anda boleh menyalinnya untuk dihantar melalui saluran lain (cth. WhatsApp rasmi).</p>
      <div class="mt-4 flex gap-2"><input readonly class="${C.input} font-mono text-xs" value="${esc(link)}" id="lnk">
      ${btn('secondary', ico('copy', 'h-4 w-4'), 'id="cpy" title="Salin"')}</div></div>
    ${modalFoot(btn('primary', 'Selesai', 'data-close'))}`, { size: 'md' });
  m.q('#cpy').onclick = () => navigator.clipboard.writeText(link).then(() => toast('Link disalin')).catch(() => { m.q('#lnk').select(); toast('Tekan Ctrl+C untuk salin', 'err'); });
}

function userForm(u) {
  const isNew = !u; u = u || { id: '', name: '', email: '', dept: '', role: 'STAFF', devices: [] };
  const roleOpt = (v, t, d) => `<label class="relative flex cursor-pointer rounded-lg p-3 ring-1 ring-inset ring-slate-300 has-[:checked]:bg-indigo-50/60 has-[:checked]:ring-2 has-[:checked]:ring-indigo-600">
      <input type="radio" name="role" value="${v}" class="sr-only" ${u.role === v ? 'checked' : ''}>
      <span><span class="block text-sm font-medium text-slate-900">${t}</span><span class="block text-xs text-slate-500">${d}</span></span></label>`;
  const m = openModal(`${modalHead(isNew ? 'Tambah pengguna' : 'Edit pengguna', isNew ? 'Cipta akaun dan jemput pengguna mendaftar Digital ID' : u.id)}
    <form id="uf" class="space-y-5 px-6 py-5">
      <div class="grid gap-4 sm:grid-cols-2">
        <div><label class="${C.label}">Staff ID</label>${isNew
          ? `<div class="flex h-[42px] items-center gap-2 rounded-lg bg-slate-50 px-3 text-sm text-slate-500 ring-1 ring-inset ring-slate-200">${ico('refresh', 'h-4 w-4')}Dijana automatik</div>`
          : `<input class="${C.input} font-mono" disabled value="${esc(u.id)}">`}</div>
        <div><label class="${C.label}">Jabatan</label><input name="dept" class="${C.input}" value="${esc(u.dept)}" placeholder="cth. Kewangan"></div>
        <div class="sm:col-span-2"><label class="${C.label}">Nama penuh</label><input name="name" class="${C.input}" required value="${esc(u.name)}"></div>
        <div class="sm:col-span-2"><label class="${C.label}">Emel rasmi</label><input name="email" type="email" class="${C.input}" required value="${esc(u.email)}" placeholder="nama@organisasi.gov.my"></div>
      </div>
      <div><span class="${C.label}">Peranan</span><div class="grid grid-cols-2 gap-3">
        ${roleOpt('STAFF', 'Staf', 'Kehadiran & tandatangan')}${roleOpt('ADMIN', 'Admin', 'Akses penuh portal admin')}</div></div>
      ${isNew ? `<label class="flex items-start gap-3 rounded-lg bg-slate-50 p-3"><input name="sendLink" type="checkbox" checked class="mt-0.5 h-4 w-4 rounded border-slate-300 accent-indigo-600">
        <span class="text-sm"><span class="font-medium text-slate-900">Hantar link pendaftaran sekarang</span><span class="block text-slate-500">Pengguna akan menerima emel untuk mendaftar cap jari pada telefon.</span></span></label>`
      : `<div><span class="${C.label}">Peranti berdaftar</span>${u.devices.length ? `<ul class="divide-y divide-slate-100 rounded-lg ring-1 ring-slate-200">${u.devices.map(d => `
          <li class="flex items-center gap-3 px-3 py-2.5">${ico('phone', 'h-4 w-4 text-slate-400')}<div class="text-sm"><p class="font-medium text-slate-700">${esc(d.label)}</p>
          <p class="text-xs text-slate-500">Didaftar ${esc(d.created.slice(0, 10))}${d.lastUsed ? ' · Terakhir digunakan ' + esc(d.lastUsed.slice(0, 16)) : ''}</p></div></li>`).join('')}</ul>`
        : '<p class="text-sm text-slate-500">Tiada peranti berdaftar.</p>'}</div>`}
      <div id="ufErr" class="hidden rounded-lg bg-rose-50 px-3 py-2.5 text-sm text-rose-700"></div>
    </form>
    ${modalFoot(btn('secondary', 'Batal', 'data-close') + `<button type="submit" form="uf" class="${C.btn} ${C.primary}">${isNew ? 'Cipta pengguna' : 'Simpan perubahan'}</button>`)}`, { size: 'md' });

  m.q('#uf').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const user = { id: u.id, name: f.get('name'), email: f.get('email'), dept: f.get('dept'), role: f.get('role') };
    busy(m.q('[form=uf]'), async () => {
      try {
        const r = await authed('adminUserSave', { user, isNew, sendLink: isNew && f.get('sendLink') === 'on' });
        m.close();
        if (isNew) toast(`Pengguna dicipta dengan Staff ID ${r.id}`); else toast('Perubahan disimpan');
        if (r.link) showLinkModal({ email: user.email }, r.link);
        if (r.id === S.me.id) S.me.role = user.role;
        renderPage();
      } catch (err) { const el = m.q('#ufErr'); el.textContent = err.message; el.classList.remove('hidden'); }
    });
  };
}

            <p class="mt-0.5 text-xs text-slate-500">${esc(d.id)} · ${d.assigned.length ? 'Untuk ' + esc(d.assigned.join(', ')) : 'Semua staf'}${d.fileId ? ' · Fail Drive dilampirkan' : ''}</p></div></div>
        <div class="flex items-center gap-4 sm:w-72">
          <div class="flex-1"><div class="flex justify-between text-xs"><span class="text-slate-500">Ditandatangani</span><span class="font-medium tabular-nums text-slate-700">${d.signedCount} / ${d.targetCount}</span></div>
            <div class="mt-1.5 h-1.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-indigo-500" style="width:${pct}%"></div></div></div>
          <button data-dm="${esc(d.id)}" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Tindakan">${ico('dots')}</button></div></div>`; }).join('')}</div>`
      : `<div class="${C.card}">${emptyState('doc', 'Tiada dokumen', 'Klik “Dokumen baharu” untuk menambah.')}</div>`;
    $$('[data-dm]').forEach(b => b.onclick = e => { e.stopPropagation(); const d = docs.find(x => x.id === b.dataset.dm);
      openMenu(b, [
        { label: 'Edit dokumen', icon: 'edit', onClick: () => docForm(d, users) },
        { label: 'Lihat penandatangan', icon: 'users', onClick: () => signersModal(d) },
        d.fileId ? { label: 'Buka fail Drive', icon: 'link', onClick: () => window.open('https://drive.google.com/file/d/' + d.fileId + '/view', '_blank') } : null,
        '-',
        { label: 'Padam dokumen', icon: 'trash', danger: true, disabled: d.signedCount > 0, onClick: async () => {
          if (!(await confirmDialog({ title: 'Padam dokumen?', message: `“${d.title}” akan dipadam.`, confirmText: 'Padam', danger: true }))) return;
          try { await authed('adminDocDelete', { docId: d.id }); toast('Dokumen dipadam'); renderPage(); } catch (err) { toast(err.message, 'err'); } } }
      ]); });
  };
  $('#dq').oninput = draw; $('#addDoc').onclick = () => docForm(null, users);
  draw();
};

function docForm(d, users) {
  const isNew = !d; d = d || { title: '', fileId: '', assigned: [], status: 'OPEN' };
  const locked = !isNew && d.signedCount > 0;
  const active = users.filter(u => u.status !== 'DISABLED');
  const m = openModal(`${modalHead(isNew ? 'Dokumen baharu' : 'Edit dokumen', isNew ? 'Dokumen yang perlu ditandatangani dengan cap jari' : d.id)}
    <form id="df" class="space-y-5 px-6 py-5">
      ${locked ? `<div class="flex gap-2 rounded-lg bg-amber-50 p-3 text-sm text-amber-800">${ico('shield', 'h-4 w-4 mt-0.5')}Dokumen sudah ditandatangani — tajuk dan fail dikunci supaya hash kekal sah.</div>` : ''}
      <div><label class="${C.label}">Tajuk dokumen</label><input name="title" class="${C.input}" required value="${esc(d.title)}" ${locked ? 'disabled' : ''}></div>
      <div><label class="${C.label}">Link / ID fail Google Drive <span class="font-normal text-slate-400">(pilihan)</span></label>
        <input name="fileId" class="${C.input}" value="${esc(d.fileId)}" placeholder="https://drive.google.com/file/d/…" ${locked ? 'disabled' : ''}>
        <p class="mt-1.5 text-xs text-slate-500">Jika diisi, hash SHA-256 dikira daripada kandungan fail sebenar.</p></div>
      <div><div class="mb-1.5 flex items-center justify-between"><span class="text-sm font-medium text-slate-700">Perlu ditandatangani oleh</span>
          <span id="asgCount" class="text-xs text-slate-500"></span></div>
        <input id="asgQ" class="${C.input} mb-2" placeholder="Cari pengguna…">
        <div id="asgList" class="max-h-48 divide-y divide-slate-100 overflow-y-auto rounded-lg ring-1 ring-slate-200">${active.map(u => `
          <label class="flex cursor-pointer items-center gap-3 px-3 py-2 hover:bg-slate-50" data-n="${esc((u.id + ' ' + u.name).toLowerCase())}">
            <input type="checkbox" value="${esc(u.id)}" class="h-4 w-4 rounded border-slate-300 accent-indigo-600" ${d.assigned.includes(u.id) ? 'checked' : ''}>
            <span class="text-sm text-slate-700">${esc(u.name)} <span class="text-slate-400">· ${esc(u.id)}</span></span></label>`).join('')}</div></div>
      <div><label class="${C.label}">Status</label><select name="status" class="${C.input}">
        <option value="OPEN" ${d.status === 'OPEN' ? 'selected' : ''}>Dibuka — boleh ditandatangani</option>
        <option value="CLOSED" ${d.status === 'CLOSED' ? 'selected' : ''}>Ditutup</option></select></div>
      <div id="dfErr" class="hidden rounded-lg bg-rose-50 px-3 py-2.5 text-sm text-rose-700"></div>
    </form>
    ${modalFoot(btn('secondary', 'Batal', 'data-close') + `<button type="submit" form="df" class="${C.btn} ${C.primary}">${isNew ? 'Cipta dokumen' : 'Simpan perubahan'}</button>`)}`, { size: 'md' });

  const count = () => { const n = $$('#asgList input:checked', m.el).length; m.q('#asgCount').textContent = n ? n + ' dipilih' : 'Tiada dipilih = semua staf'; };
  $$('#asgList input', m.el).forEach(i => i.onchange = count); count();
  m.q('#asgQ').oninput = e => { const q = e.target.value.toLowerCase(); $$('#asgList label', m.el).forEach(l => l.classList.toggle('hidden', !!q && !l.dataset.n.includes(q))); };
  m.q('#df').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const doc = { id: d.id, title: locked ? d.title : f.get('title'), fileId: locked ? d.fileId : f.get('fileId'), status: f.get('status'),
      assigned: $$('#asgList input:checked', m.el).map(i => i.value).join(',') };
    busy(m.q('[form=df]'), async () => {
      try { const r = await authed('adminDocSave', { doc, isNew }); m.close(); toast(isNew ? `Dokumen ${r.id} dicipta` : 'Perubahan disimpan'); renderPage(); }
      catch (err) { const el = m.q('#dfErr'); el.textContent = err.message; el.classList.remove('hidden'); }
    });
  };
}

async function signersModal(d) {
  const m = openModal(`${modalHead('Penandatangan', d.title)}<div id="sg" class="px-6 py-5"><div class="skeleton h-24 rounded-lg"></div></div>
    ${modalFoot(btn('primary', 'Tutup', 'data-close'))}`, { size: 'md' });
  try {
    const list = (await authed('adminSignatures')).filter(s => s.docId === d.id);
    const signedIds = list.map(s => s.staffId);
    const outstanding = (d.assigned.length ? d.assigned : (S.users || []).filter(u => u.status === 'ACTIVE').map(u => u.id)).filter(id => !signedIds.includes(id));
    m.q('#sg').innerHTML = `${list.length ? `<ul class="divide-y divide-slate-100">${list.map(s => `<li class="flex items-center gap-3 py-2.5">${avatar(s.name, 'h-8 w-8 text-[11px]')}
        <div class="min-w-0 flex-1"><p class="text-sm font-medium text-slate-900">${esc(s.name)}</p><p class="text-xs text-slate-500">${esc(s.time)} · ${esc(s.receipt)}</p></div>${badge('SIGNED')}</li>`).join('')}</ul>`
      : '<p class="text-sm text-slate-500">Belum ada tandatangan.</p>'}
      ${outstanding.length ? `<p class="mt-5 text-xs font-semibold uppercase tracking-wide text-slate-400">Belum menandatangani (${outstanding.length})</p>
        <p class="mt-2 text-sm text-slate-600">${esc(outstanding.join(', '))}</p>` : ''}`;
  } catch (e) { m.q('#sg').textContent = e.message; }
}

/* ═══════════ HALAMAN: Kehadiran ═══════════ */
PAGES.attendance = async view => {
  const t = todayKL();
  S.attFrom = S.attFrom || t; S.attTo = S.attTo || t;
  const rows = await authed('adminAttendance', { from: S.attFrom, to: S.attTo });
  const uniq = new Set(rows.filter(r => r.type === 'IN').map(r => r.staffId)).size;
  if (!view.set(`${pageHead('Kehadiran', 'Rekod daftar masuk & keluar yang disahkan dengan cap jari', btn('secondary', ico('download', 'h-4 w-4') + 'Muat turun CSV', 'id="csv"'))}
    <div class="${C.card} mb-4 flex flex-col gap-3 p-4 sm:flex-row sm:items-end">
      <div><label class="${C.label}">Dari</label><input type="date" id="aFrom" class="${C.input}" value="${S.attFrom}"></div>
      <div><label class="${C.label}">Hingga</label><input type="date" id="aTo" class="${C.input}" value="${S.attTo}"></div>
      ${btn('primary', 'Papar', 'id="aGo"')}
      <div class="flex gap-6 sm:ml-auto sm:pr-2">
        <div><p class="text-xs text-slate-500">Rekod</p><p class="text-lg font-semibold tabular-nums">${rows.length}</p></div>
        <div><p class="text-xs text-slate-500">Pengguna hadir</p><p class="text-lg font-semibold tabular-nums">${uniq}</p></div></div></div>
    <div class="${C.card} relative overflow-hidden"><div class="relative overflow-x-auto"><table class="min-w-full divide-y divide-slate-100">
      <thead class="bg-slate-50/70"><tr><th class="${C.th}">Masa</th><th class="${C.th}">Pengguna</th><th class="${C.th}">Jenis</th><th class="${C.th} hidden sm:table-cell">Lokasi</th><th class="${C.th} hidden md:table-cell">Rujukan</th></tr></thead>
      <tbody class="divide-y divide-slate-100">${rows.length ? rows.map(r => `<tr>
        <td class="${C.td} whitespace-nowrap tabular-nums text-slate-600">${esc(r.time.slice(0, 16))}</td>
        <td class="${C.td}"><p class="font-medium text-slate-900">${esc(r.name)}</p><p class="text-xs text-slate-500">${esc(r.staffId)}</p></td>
        <td class="${C.td}">${badge(r.type)}</td>
        <td class="${C.td} hidden sm:table-cell">${r.lat ? `<a target="_blank" rel="noopener" href="https://maps.google.com/?q=${esc(r.lat)},${esc(r.lng)}" class="inline-flex items-center gap-1 text-indigo-600 hover:text-indigo-500">${ico('pin', 'h-4 w-4')}Peta</a>` : '<span class="text-slate-400">—</span>'}</td>
        <td class="${C.td} hidden font-mono text-xs text-slate-500 md:table-cell">${esc(r.id)}</td></tr>`).join('')
        : `<tr><td colspan="5">${emptyState('clock', 'Tiada rekod', 'Tiada kehadiran direkod dalam tempoh ini.')}</td></tr>`}</tbody></table></div></div>`)) return;
  $('#aGo').onclick = () => { S.attFrom = $('#aFrom').value || t; S.attTo = $('#aTo').value || S.attFrom; renderPage(); };
  $('#csv').onclick = () => downloadCsv(`kehadiran_${S.attFrom}_${S.attTo}.csv`,
    [['Masa', 'StaffID', 'Nama', 'Jenis', 'Lat', 'Lng', 'Rujukan'], ...rows.map(r => [r.time, r.staffId, r.name, r.type, r.lat, r.lng, r.id])]);
};
function downloadCsv(name, rows) {
  const csv = rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  const rows = await authed('adminSignatures');
  if (!view.set(`${pageHead('Rekod tandatangan', 'Setiap tandatangan boleh disahkan semula secara kriptografi pada bila-bila masa')}

    <div class="${C.card} relative overflow-hidden"><div class="relative overflow-x-auto"><table class="min-w-full divide-y divide-slate-100">
      <thead class="bg-slate-50/70"><tr><th class="${C.th}">Dokumen</th><th class="${C.th}">Penandatangan</th><th class="${C.th} hidden md:table-cell">Masa</th>
        <th class="${C.th} hidden lg:table-cell">Hash dokumen</th><th class="${C.th} text-right">Pengesahan</th></tr></thead>
      <tbody id="sRows" class="divide-y divide-slate-100"></tbody></table></div></div>`)) return;

      <td class="${C.td}"><p class="font-medium text-slate-900">${esc(r.title)}</p><p class="font-mono text-xs text-slate-500">${esc(r.receipt)}</p></td>
      <td class="${C.td}"><p class="text-slate-900">${esc(r.name)}</p><p class="text-xs text-slate-500">${esc(r.staffId)}<span class="md:hidden"> · ${esc(r.time.slice(0, 16))}</span></p></td>

      <td class="${C.td} hidden font-mono text-xs text-slate-500 lg:table-cell" title="${esc(r.docHash)}">${esc(r.docHash.slice(0, 16))}…</td>
      <td class="${C.td} text-right" data-v="${esc(r.receipt)}">${btn('secondary', ico('shield', 'h-4 w-4') + 'Sahkan', `data-verify="${esc(r.receipt)}"`)}</td></tr>`).join('')
      : `<tr><td colspan="5">${emptyState('pen', 'Tiada rekod tandatangan')}</td></tr>`;
    $$('[data-verify]').forEach(b => b.onclick = () => busy(b, async () => {
      try { const v = await authed('adminVerifySignature', { receiptId: b.dataset.verify });
        b.parentElement.innerHTML = `<span title="${esc(v.reason)}">${badge(v.valid ? 'VALID' : 'INVALID')}</span>`;

  };
  $('#sq').oninput = draw; draw();
};

/* ═══════════ Permulaan ═══════════ */
/* ═══════════ LOG MASUK PANTAS: terus ke cap jari tanpa skrin tambahan ═══════════ */
const FAST = { start: null, at: 0, timer: null };
const fastMe = () => { try { return JSON.parse(localStorage.getItem('fastLogin') || 'null'); } catch (e) { return null; } };

async function prefetchLogin() {
  try { FAST.start = await api('authStart', { purpose: 'LOGIN' }); FAST.at = Date.now(); } catch (e) { FAST.start = null; }
}

function setupFastLogin() {
  const btnEl = $('#fpBtn'), hint = btnEl.nextElementSibling, me = fastMe();
  if (me) hint.innerHTML = `Log masuk sebagai <b class="text-slate-600">${esc(me.name)}</b> · <button type="button" id="notMe" class="font-medium text-indigo-600 hover:text-indigo-500">Bukan anda?</button>`;
  const nm = $('#notMe');
  if (nm) nm.onclick = () => { try { localStorage.removeItem('fastLogin'); } catch (e) {} renderLogin(); };
  prefetchLogin();
  clearInterval(FAST.timer);
  FAST.timer = setInterval(() => { if (!$('#fpBtn')) return clearInterval(FAST.timer); prefetchLogin(); }, 240000);
  btnEl.onclick = () => fastLogin(btnEl);
}

async function fastLogin(btnEl) {
  showAlert('lgMsg');
  const st = FAST.start;
  if (!st || Date.now() - FAST.at > 270000) { prefetchLogin(); return doLogin({}, btnEl); }
  FAST.start = null;
  const me = fastMe();
  let a;
  try {
    a = await navigator.credentials.get({ publicKey: {
      challenge: b64u.dec(st.publicKey.challenge), rpId: st.publicKey.rpId, timeout: 60000, userVerification: 'required',
      allowCredentials: me ? [{ type: 'public-key', id: b64u.dec(me.credId) }] : []
    }});
  } catch (e) {
    prefetchLogin();
    return showAlert('lgMsg', webauthnError(e) + (me ? ' Jika passkey telah dipadam dari telefon, klik "Bukan anda?".' : ''));
  }
  busy(btnEl, async () => {
    try {
      const out = await api('authFinish', { challengeId: st.challengeId, credential: {
        id: a.id, clientDataJSON: b64u.enc(a.response.clientDataJSON),
        authenticatorData: b64u.enc(a.response.authenticatorData), signature: b64u.enc(a.response.signature) } });
      try { localStorage.setItem('fastLogin', JSON.stringify({ credId: a.id, name: out.staff.name })); } catch (e) {}
      finishLogin(out);
    } catch (e) {
      if (/tidak dikenali|tidak aktif/.test(e.message)) { try { localStorage.removeItem('fastLogin'); } catch (x) {} }
      prefetchLogin(); showAlert('lgMsg', e.message);
    }
  });
}
(async function boot() {
  if (!window.PublicKeyCredential) return renderUnsupported();
  try { S.cfg = await api('publicConfig'); } catch (e) { /* teruskan tanpa SSO */ }
  if (regToken) {   // pendaftaran mesti pada telefon yang ada cap jari / Face ID
    const platform = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(() => false);
    return platform ? renderRegister() : renderUnsupported();
  }
  if (S.token) {
    try { S.me = (await api('me', { sessionToken: S.token })).staff; return renderShell(); }
    catch (e) { store.del('session', true); S.token = null; }
  }
  renderLogin();
})();
</script>
