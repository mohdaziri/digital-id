             return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '=';

/* ═══════════ API ═══════════ */
async function api(action, body = {}) {
  let res;
  try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...body }) }); }
  catch (e) { throw new Error('Tidak dapat menghubungi pelayan. Semak sambungan internet.'); }
  const j = await res.json();
  if (!j.ok) {
    if (/Sesi tamat/.test(j.error) && S.me) { logout(j.error); }
    throw new Error(j.error);
  }
  return j.data;
}
const authed = (action, body = {}) => api(action, { sessionToken: S.token, ...body });

/* ═══════════ Toast, Modal, Menu ═══════════ */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  const tone = type === 'err' ? 'text-rose-600' : 'text-emerald-600';
  el.className = 'pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-xl bg-white p-4 shadow-lg ring-1 ring-slate-200 transition duration-300 translate-y-2 opacity-0';
  el.innerHTML = `<span class="${tone}">${ico(type === 'err' ? 'x' : 'check')}</span><p class="text-sm text-slate-700">${esc(msg)}</p>`;
  $('#toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));
  setTimeout(() => { el.classList.add('opacity-0'); setTimeout(() => el.remove(), 300); }, type === 'err' ? 6000 : 3500);
}

const modalStack = [];
function openModal(html, { size = 'md', onClose, dismissable = true } = {}) {
  const sizes = { sm: 'sm:max-w-sm', md: 'sm:max-w-lg', lg: 'sm:max-w-2xl' };
  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-4';
  wrap.innerHTML = `<div data-bd class="absolute inset-0 bg-slate-900/40 opacity-0 backdrop-blur-[2px] transition"></div>
    <div data-panel role="dialog" aria-modal="true" class="relative max-h-[92vh] w-full ${sizes[size]} translate-y-4 overflow-y-auto rounded-t-2xl bg-white opacity-0 shadow-xl ring-1 ring-slate-200 transition sm:rounded-2xl">${html}</div>`;
  document.body.appendChild(wrap);
  const panel = $('[data-panel]', wrap), bd = $('[data-bd]', wrap);
  requestAnimationFrame(() => { bd.classList.remove('opacity-0'); panel.classList.remove('translate-y-4', 'opacity-0'); });
  let closed = false;
  const m = {
    el: wrap, q: s => $(s, wrap),
    close(fromUser) {
      if (closed) return; closed = true;
      bd.classList.add('opacity-0'); panel.classList.add('translate-y-4', 'opacity-0');
      setTimeout(() => wrap.remove(), 160);
      modalStack.splice(modalStack.indexOf(m), 1);
      if (fromUser && onClose) onClose();
    },
    dismissable
  };
  if (dismissable) bd.onclick = () => m.close(true);
  $$('[data-close]', wrap).forEach(b => b.onclick = () => m.close(true));
  modalStack.push(m);
  setTimeout(() => { const f = $('input:not([type=checkbox]):not([disabled]),select', panel); if (f && window.innerWidth > 640) f.focus(); }, 60);
  return m;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); const m = modalStack[modalStack.length - 1]; if (m && m.dismissable) m.close(true); } });

const modalHead = (title, sub) => `<div class="flex items-start justify-between gap-4 border-b border-slate-100 px-6 py-4">

const modalFoot = inner => `<div class="flex flex-col-reverse gap-2 border-t border-slate-100 bg-slate-50/60 px-6 py-4 sm:flex-row sm:justify-end">${inner}</div>`;

function confirmDialog({ title, message, confirmText = 'Teruskan', danger = false }) {
  return new Promise(res => {
    const m = openModal(`<div class="p-6"><div class="flex gap-4">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full ${danger ? 'bg-rose-50 text-rose-600' : 'bg-indigo-50 text-indigo-600'}">${ico(danger ? 'trash' : 'shield')}</div>
        <div><h3 class="text-base font-semibold text-slate-900">${esc(title)}</h3><p class="mt-1 text-sm text-slate-500">${esc(message)}</p></div></div></div>
      ${modalFoot(btn('secondary', 'Batal', 'data-close') + btn(danger ? 'danger' : 'primary', esc(confirmText), 'data-ok'))}`,
      { size: 'sm', onClose: () => res(false) });
    m.q('[data-ok]').onclick = () => { m.close(); res(true); };
  });
}

function closeMenu() { const m = $('#ctxMenu'); if (m) m.remove(); }
function openMenu(anchor, items) {
  closeMenu();
  const r = anchor.getBoundingClientRect();
  const m = document.createElement('div');
  m.id = 'ctxMenu';
  m.className = 'fixed z-40 w-56 rounded-xl bg-white py-1.5 shadow-lg ring-1 ring-slate-200';
  m.innerHTML = items.filter(Boolean).map((it, i) => it === '-' ? '<div class="my-1 border-t border-slate-100"></div>' :
    `<button data-i="${i}" ${it.disabled ? 'disabled' : ''} class="flex w-full items-center gap-2.5 px-3.5 py-2 text-left text-sm ${it.danger ? 'text-rose-600 hover:bg-rose-50' : 'text-slate-700 hover:bg-slate-50'} disabled:opacity-40">${ico(it.icon, 'h-4 w-4')}${esc(it.label)}</button>`).join('');
  document.body.appendChild(m);
  const h = m.offsetHeight, top = r.bottom + h + 8 > window.innerHeight ? r.top - h - 4 : r.bottom + 4;
  m.style.top = Math.max(8, top) + 'px';
  m.style.left = Math.max(8, Math.min(r.right - 224, window.innerWidth - 232)) + 'px';
  const list = items.filter(Boolean);
  $$('[data-i]', m).forEach(b => b.onclick = e => { e.stopPropagation(); closeMenu(); list[b.dataset.i].onClick(); });
  setTimeout(() => document.addEventListener('click', closeMenu, { once: true }), 0);
}
window.addEventListener('scroll', closeMenu, true);
window.addEventListener('resize', closeMenu);

async function busy(btnEl, fn) {
  const html = btnEl.innerHTML; btnEl.disabled = true;
  btnEl.innerHTML = `<svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>${btnEl.textContent.trim() ? 'Sila tunggu…' : ''}`;
  try { return await fn(); } finally { btnEl.disabled = false; btnEl.innerHTML = html; }
}

function webauthnError(e) {
  if (e.name === 'NotAllowedError') return 'Pengesahan dibatalkan atau tamat masa.';
  if (e.name === 'InvalidStateError') return 'Peranti ini sudah didaftarkan untuk akaun ini.';
  if (e.name === 'SecurityError') return 'Ralat keselamatan: semak RP_ID / ORIGIN dalam Config sama dengan domain portal.';
  return e.message || String(e);
}
function deviceLabel() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone'; if (/iPad/.test(ua)) return 'iPad';
  const m = ua.match(/Android[^;]*;\s*([^;)]+)/); if (m) return 'Android ' + m[1].replace(/Build.*/, '').trim();
  return /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'Peranti';
}

/* ═══════════ Pengesahan cap jari (2 langkah: ringkasan → imbas, sesuai Safari iOS) ═══════════ */
async function biometric(purpose, params, pre) {
  const start = pre || await api('authStart', { purpose, ...params });
  const s = start.summary;
  return new Promise((resolve, reject) => {
    const detail = s.kind === 'ATTENDANCE'
      ? `<p class="mt-1 text-4xl font-semibold tabular-nums tracking-tight text-slate-900">${esc(s.at)}</p>
         <div class="mt-4 space-y-2 rounded-xl bg-slate-50 p-4 text-left text-sm ring-1 ring-slate-200">
           ${s.where ? `<p class="flex items-start gap-2 ${s.outstation ? 'text-violet-700' : 'text-slate-700'}">${ico(s.outstation ? 'brief' : 'pin', 'h-4 w-4 mt-0.5')}<span>${esc(s.where)}</span></p>` : ''}
           <p class="flex items-start gap-2 text-slate-600">${ico('calendar', 'h-4 w-4 mt-0.5')}<span>${esc(s.sched)}</span></p></div>
         ${s.warning ? `<p class="mt-3 flex items-start gap-2 rounded-lg bg-amber-50 p-3 text-left text-sm text-amber-800">${ico('alert', 'h-4 w-4 mt-0.5')}<span>${esc(s.warning)}</span></p>` : ''}`
      : s.title
      ? `<div class="mt-4 rounded-xl bg-slate-50 p-4 text-left ring-1 ring-slate-200">
           <p class="text-sm font-medium text-slate-900">${esc(s.title)}</p>
           <p class="mt-2 break-all font-mono text-[11px] leading-relaxed text-slate-500">SHA-256 · ${esc(s.docHash)}</p></div>
         <p class="mt-3 text-xs text-slate-500">Dengan mengimbas cap jari, anda bersetuju menandatangani dokumen ini secara digital.</p>`
      : `<p class="mt-1 text-sm text-slate-500">${esc(s.at || 'Sahkan identiti anda untuk meneruskan')}</p>`;
    const m = openModal(`<div class="px-6 pb-6 pt-8 text-center">
        <div class="fp-pulse mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">${ico('finger', 'h-10 w-10')}</div>
        <h3 class="mt-5 text-lg font-semibold text-slate-900">${esc(s.label)}</h3>${detail}
        <div class="mt-6 grid gap-2">
          ${btn('primary', ico('finger') + 'Imbas cap jari / Face ID', 'data-go')}
          ${btn('ghost', 'Batal', 'data-close')}
        </div></div>`, { size: 'sm', onClose: () => reject(new Error('Dibatalkan.')) });

    m.q('[data-go]').onclick = async () => {
      const pk = start.publicKey;
      let a;
      try {
        a = await navigator.credentials.get({ publicKey: {
          challenge: b64u.dec(pk.challenge), rpId: pk.rpId, timeout: pk.timeout, userVerification: pk.userVerification,
          // transports tidak dihadkan → di PC, browser boleh paparkan kod QR untuk imbas dengan telefon berdaftar
          allowCredentials: pk.allowCredentials.map(c => ({ type: 'public-key', id: b64u.dec(c.id) }))
        }});
      } catch (e) { m.close(); return reject(new Error(webauthnError(e))); }
      await busy(m.q('[data-go]'), async () => {
        try {
          const out = await api('authFinish', { challengeId: start.challengeId, credential: {
            id: a.id, clientDataJSON: b64u.enc(a.response.clientDataJSON),
            authenticatorData: b64u.enc(a.response.authenticatorData), signature: b64u.enc(a.response.signature) } });
          m.close(); resolve(out);
        } catch (e) { m.close(); reject(e); }
      });
    };
  });
}

/* ═══════════ Google Sign-In (SSO) ═══════════ */
let gisLoad = null, gisInit = false, gisHandler = null;
function loadGis() {
  if (!S.cfg.googleClientId) return Promise.resolve(false);
  if (!gisLoad) gisLoad = new Promise(res => {
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    sc.onload = () => res(true); sc.onerror = () => res(false);
    document.head.appendChild(sc);
  });
  return gisLoad;
}
/** Papar butang Google dalam elemen `el`. handler(idToken) dipanggil selepas pengguna memilih akaun. */
async function mountGoogle(el, handler, { oneTap = false, text = 'continue_with' } = {}) {
  if (!el || !(await loadGis()) || !window.google) return false;
  gisHandler = handler;
  if (!gisInit) {
    google.accounts.id.initialize({ client_id: S.cfg.googleClientId, callback: r => gisHandler && gisHandler(r.credential),
      auto_select: true, use_fedcm_for_prompt: true, context: 'signin', itp_support: true });
    gisInit = true;
  }
  google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', shape: 'pill', text, logo_alignment: 'center',
    width: Math.min(Math.max(el.offsetWidth, 240), 400), locale: 'ms' });
  if (oneTap) google.accounts.id.prompt();   // "Teruskan sebagai …" jika pengguna sudah log masuk Google
  return true;
}

      return showAlert('lgMsg', `Emel ${r.email} tiada dalam sistem. Hubungi pentadbir untuk didaftarkan.`);
    }
    hello.innerHTML = `${avatar(r.name)}<div class="min-w-0"><p class="truncate text-sm font-medium text-slate-900">Hai, ${esc(r.name)}</p>

async function doLogin(params, btnEl) {
  showAlert('lgMsg');
  const run = async () => {
    try { finishLogin(await biometric('LOGIN', params)); }
    catch (e) { if (e.message !== 'Dibatalkan.') showAlert('lgMsg', e.message); }
  };
  return btnEl ? busy(btnEl, run) : run();
}

function finishLogin(out) {
  store.set('session', out.sessionToken, true);
  S.token = out.sessionToken; S.me = out.staff;
  if (location.hash && location.hash !== '#/home') location.hash = '#/home';
  renderShell();
}

/* ═══════════ Phase 1: Pendaftaran (sekali sahaja) ═══════════ */
const REG = { step: 1, email: '', masked: '', opts: null };
function renderRegister() {
  const steps = ['Emel', 'Pengesahan', 'Cap jari'];
  const bar = REG.step <= 3 ? `<ol class="mb-6 flex items-center gap-2">${steps.map((t, i) => {
      const n = i + 1, done = n < REG.step, cur = n === REG.step;
      return `<li class="flex flex-1 items-center gap-2"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-semibold ${done ? 'bg-indigo-600 text-white' : cur ? 'bg-indigo-50 text-indigo-700 ring-2 ring-indigo-600' : 'bg-slate-100 text-slate-400'}">${done ? ico('check', 'h-4 w-4') : n}</span>
        <span class="hidden text-xs font-medium sm:inline ${cur ? 'text-slate-900' : 'text-slate-400'}">${t}</span>${n < 3 ? '<span class="h-px flex-1 bg-slate-200"></span>' : ''}</li>`; }).join('')}</ol>` : '';
  const g = !!S.cfg.googleClientId;

  let body = '';
  if (REG.step === 1) body = `<h2 class="text-lg font-semibold">Pendaftaran Digital ID</h2>
    <p class="mt-1 text-sm text-slate-500">Sahkan emel rasmi anda untuk mula mendaftar.</p>
    ${g ? `<div id="gReg" class="mt-6 flex min-h-[44px] w-full justify-center"></div>
      <p class="mt-2 text-center text-xs text-slate-400">Paling cepat — tiada kod perlu ditaip</p>
      <div class="my-5 flex items-center gap-3 text-xs text-slate-400"><span class="h-px flex-1 bg-slate-200"></span>atau guna kod emel<span class="h-px flex-1 bg-slate-200"></span></div>` : ''}
    <form id="rf" class="${g ? '' : 'mt-6'} space-y-4"><div><label class="${C.label}">Emel rasmi</label>
      <input id="rgEmail" type="email" class="${C.input}" placeholder="nama@organisasi.gov.my" autocomplete="email" required value="${esc(REG.email)}"></div>
      <button class="${C.btn} ${g ? C.secondary : C.primary} w-full py-3">${ico('mail')}Hantar kod pengesahan</button></form>`;
  if (REG.step === 2) body = `<h2 class="text-lg font-semibold">Masukkan kod</h2>
    <p class="mt-1 text-sm text-slate-500">Kod 6 digit telah dihantar ke <b class="text-slate-700">${esc(REG.masked)}</b>.</p>
    <form id="rf" class="mt-6 space-y-4"><div><label class="${C.label}">Kod pengesahan</label>
      <input id="rgOtp" class="${C.input} text-center font-mono text-2xl tracking-[.5em]" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" required></div>
      <button class="${C.btn} ${C.primary} w-full py-3">Sahkan kod</button></form>
    <button id="rgResend" class="${C.btn} ${C.ghost} mt-2 w-full">Hantar semula kod</button>`;
  if (REG.step === 3) body = `<div class="text-center"><div class="fp-pulse mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">${ico('finger', 'h-10 w-10')}</div>
    <h2 class="mt-5 text-lg font-semibold">Daftar cap jari / Face ID</h2>
    <p class="mt-2 text-sm text-slate-500">Hai <b class="text-slate-700">${esc(REG.opts.user.displayName)}</b>. Tekan butang di bawah dan imbas cap jari atau Face ID apabila telefon meminta.</p>
    <button id="rgPasskey" class="${C.btn} ${C.primary} mt-6 w-full py-3">${ico('finger')}Register Biometric / Passkey</button></div>`;
  if (REG.step === 4) body = `<div class="text-center"><div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-50 text-emerald-600">${ico('check', 'h-8 w-8')}</div>
    <h2 class="mt-5 text-lg font-semibold">Pendaftaran berjaya</h2>
    <p class="mt-2 text-sm text-slate-500">Cap jari anda telah dikaitkan dengan <b class="text-slate-700">${esc(REG.email)}</b>. Mulai sekarang, log masuk hanya perlukan cap jari — tiada kata laluan.</p>
    <button id="rgDone" class="${C.btn} ${C.primary} mt-6 w-full py-3">Log masuk sekarang</button></div>`;
  authLayout(bar + body + alertBox('rgMsg'));

  const sendOtp = b => busy(b, async () => {
    try { const r = await api('regStart', { token: regToken, email: REG.email }); REG.masked = r.maskedEmail;
      const resend = REG.step === 2; REG.step = 2; renderRegister(); if (resend) showAlert('rgMsg', 'Kod baharu telah dihantar.', true);
    } catch (e) { showAlert('rgMsg', e.message); }
  });
  if (REG.step === 1) {
    $('#rf').onsubmit = e => { e.preventDefault(); REG.email = $('#rgEmail').value.trim().toLowerCase(); sendOtp($('#rf button')); };
    if (g) mountGoogle($('#gReg'), async idToken => {
      showAlert('rgMsg');
      try { REG.opts = await api('regVerifyGoogle', { token: regToken, idToken }); REG.email = REG.opts.user.name; REG.step = 3; renderRegister(); }
      catch (err) { showAlert('rgMsg', err.message); }
    }, { text: 'continue_with' });
  }
  if (REG.step === 2) {
    $('#rgResend').onclick = e => sendOtp(e.currentTarget);
    $('#rf').onsubmit = e => { e.preventDefault(); busy($('#rf button'), async () => {
      try { REG.opts = await api('regVerifyOtp', { token: regToken, email: REG.email, otp: $('#rgOtp').value }); REG.step = 3; renderRegister(); }
      catch (err) { showAlert('rgMsg', err.message); } }); };
  }
  if (REG.step === 3) $('#rgPasskey').onclick = async e => {
    const b = e.currentTarget, o = REG.opts;
    showAlert('rgMsg');
    let cred;
    try {   // dipanggil terus dari klik — keperluan "user gesture" Safari iOS
      cred = await navigator.credentials.create({ publicKey: {
        challenge: b64u.dec(o.challenge), rp: o.rp,
        user: { id: b64u.dec(o.user.id), name: o.user.name, displayName: o.user.displayName },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        // residentKey "required" → passkey boleh dicari, jadi log masuk tidak perlu taip ID/emel
        authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'required', requireResidentKey: true, userVerification: 'required' },
        attestation: 'none', timeout: 60000,
        excludeCredentials: o.excludeCredentials.map(c => ({ type: 'public-key', id: b64u.dec(c.id) }))
      }});
    } catch (err) { return showAlert('rgMsg', webauthnError(err)); }
    const r = cred.response;
    if (!r.getPublicKey || !r.getAuthenticatorData) return showAlert('rgMsg', 'Browser terlalu lama. Sila kemas kini browser anda.');
    busy(b, async () => {
      try {
        await api('regFinish', { token: regToken, email: REG.email, deviceLabel: deviceLabel(), credential: {
          id: cred.id, rawId: b64u.enc(cred.rawId), clientDataJSON: b64u.enc(r.clientDataJSON),
          authenticatorData: b64u.enc(r.getAuthenticatorData()), publicKey: b64u.enc(r.getPublicKey()),
          publicKeyAlg: r.getPublicKeyAlgorithm(), transports: r.getTransports ? r.getTransports() : [] } });
        store.set('lastEmail', REG.email); REG.step = 4; renderRegister();
      } catch (err) { showAlert('rgMsg', err.message); }
    });
  };
  if (REG.step === 4) $('#rgDone').onclick = () => { history.replaceState(null, '', location.pathname); renderLogin(); };
}

const fmtMin = m => !m ? '—' : m < 60 ? `${m}m` : `${Math.floor(m / 60)}j ${String(m % 60).padStart(2, '0')}m`;
const fmtDist = d => d >= 1000 ? (d / 1000).toFixed(1) + ' km' : Math.round(d) + ' m';
const nowKL = () => new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Asia/Kuala_Lumpur' });
function stBadges(r) {
  const list = [r.status];
  (r.flags || []).forEach(f => { if (f !== r.status && ['LEWAT', 'PULANG_AWAL', 'TIADA_KELUAR', 'HARI_REHAT'].includes(f)) list.push(f); });
  return list.map(x => badge(x)).join(' ') + (r.outstation ? ' ' + badge('LUAR') : '') + (r.pendingReview ? ' ' + badge('MENUNGGU') : '');
}

function attendanceCard(t) {
  const st = t.status, s = t.sched;
  const detail = [];
  if (st.in) detail.push(`Masuk <b class="text-slate-900 tabular-nums">${esc(st.in)}</b>`);

  if (st.late) detail.push(`<span class="text-amber-700">lewat ${fmtMin(st.late)}</span>`);
  if (st.worked) detail.push(`${fmtMin(st.worked)} bekerja`);
  const hint = st.status === 'BEKERJA' && st.requiredOut ? `Boleh daftar keluar selepas <b class="tabular-nums">${esc(st.requiredOut)}</b>`
    : st.status === 'BELUM' ? 'Anda belum daftar masuk' : st.status === 'TIDAK_HADIR' ? 'Tiada rekod masuk hari ini' : '';
  return `<section class="${C.card} p-5 sm:p-6">
    <div class="flex items-start justify-between gap-4">
      <div><h2 class="text-base font-semibold text-slate-900">Kehadiran ${t.date === todayKL() ? 'hari ini' : esc(t.date)}</h2>

      <a href="#/mine" class="shrink-0 font-medium text-indigo-600 hover:text-indigo-500">Rekod bulanan →</a></div>
  </section>`;
}

let clockTimer = null;
function startLiveClock() {
  clearInterval(clockTimer);
  clockTimer = setInterval(() => { const el = $('#liveClock'); if (!el) return clearInterval(clockTimer); el.textContent = nowKL().slice(0, 5); }, 1000);
}

/** Dapatkan lokasi GPS (ketepatan tinggi). Pulangkan {lat,lng,acc} atau {geoError} */
function getGeoFix() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ geoError: 'Browser tidak menyokong GPS' });
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      e => res({ geoError: e.code === 1 ? 'Akses lokasi ditolak' : e.code === 3 ? 'GPS tamat masa' : 'Lokasi tidak tersedia' }),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  });
}

/** Di luar radius → tanya sama ada tugas luar. Pulangkan catatan atau null */
function outstationDialog(o) {
  return new Promise(res => {
    const m = openModal(`<div class="p-6">
        <div class="flex gap-4"><div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-amber-50 text-amber-600">${ico('pin')}</div>
          <div><h3 class="text-base font-semibold text-slate-900">Anda di luar kawasan pejabat</h3>
          <p class="mt-1 text-sm text-slate-500">Anda berada kira-kira <b class="text-slate-700">${fmtDist(o.distance)}</b> dari ${esc(o.location)} (had ${o.radius} m).</p></div></div>
        <form id="osf" class="mt-5 space-y-3">
          <label class="${C.label}">Jika anda bertugas di luar, nyatakan tujuan / lokasi</label>
          <textarea name="note" rows="3" minlength="5" maxlength="200" required class="${C.input}" placeholder="cth. Mesyuarat di JPA Putrajaya"></textarea>
          <p class="text-xs text-slate-500">Rekod tugas luar akan disemak oleh admin.</p></form></div>
      ${modalFoot(btn('secondary', 'Cuba lagi', 'data-close') + `<button type="submit" form="osf" class="${C.btn} ${C.primary}">${ico('brief', 'h-4 w-4')}Daftar sebagai Tugas Luar</button>`)}`,
      { size: 'sm', onClose: () => res(null) });
    m.q('#osf').onsubmit = e => { e.preventDefault(); const n = new FormData(e.target).get('note').trim(); m.close(); res(n); };
  });
}

async function clockFlow(type, b) {
  await busy(b, async () => {
    try {
      const geo = await getGeoFix();
      let start = await authed('authStart', { purpose: 'ATTENDANCE', type, ...geo });
      if (start.outside) {
        const note = await outstationDialog(start);
        if (!note) return;
        start = await authed('authStart', { purpose: 'ATTENDANCE', type, ...geo, outstation: true, note });
      }
      const out = await biometric('ATTENDANCE', null, start);
      toast(`${out.type === 'IN' ? 'Daftar masuk' : 'Daftar keluar'} direkod pada ${out.time.slice(11, 16)}${out.outstation ? ' (tugas luar)' : ''}`);
      renderPage();
    } catch (e) { if (e.message !== 'Dibatalkan.') toast(e.message, 'err'); }
  });
}

      <td class="${C.td} text-right"><button data-menu="${esc(u.id)}" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Tindakan">${ico('dots')}</button></td></tr>`).join('')
      : `<tr><td colspan="6">${emptyState('users', 'Tiada pengguna dijumpai', 'Cuba ubah carian atau tapisan.')}</td></tr>`;
    $$('#uRows [data-u]').forEach(tr => tr.onclick = e => { if (!e.target.closest('[data-menu]')) userForm(users.find(u => u.id === tr.dataset.u)); });
    $$('#uRows [data-menu]').forEach(b => b.onclick = e => { e.stopPropagation(); userMenu(b, users.find(u => u.id === b.dataset.menu)); });
  };
  ['uq', 'uStatus', 'uRole'].forEach(id => $('#' + id).oninput = draw);
  $('#addUser').onclick = () => userForm(null);
  draw();
};

function userMenu(anchor, u) {
  const self = u.id === S.me.id;
  openMenu(anchor, [
    { label: 'Edit maklumat', icon: 'edit', onClick: () => userForm(u) },
    { label: u.status === 'ACTIVE' ? 'Hantar link tambah peranti' : u.status === 'INVITED' ? 'Hantar semula link' : 'Hantar link pendaftaran',
      icon: 'mail', disabled: u.status === 'DISABLED', onClick: () => userAction(u, 'SEND_LINK') },
    { label: 'Batal semua passkey', icon: 'key', disabled: self || !u.devices.length, onClick: () => userAction(u, 'REVOKE') },
    u.status === 'DISABLED' ? { label: 'Aktifkan semula', icon: 'play', onClick: () => userAction(u, 'ENABLE') }
      : { label: 'Nyahaktifkan', icon: 'ban', disabled: self, onClick: () => userAction(u, 'DISABLE') },
    '-',
    { label: 'Padam pengguna', icon: 'trash', danger: true, disabled: self, onClick: () => userAction(u, 'DELETE') }
  ]);
}

const CONFIRMS = {
  REVOKE: u => ({ title: 'Batal semua passkey?', message: `${u.name} tidak akan dapat log masuk sehingga mendaftar semula. Gunakan jika telefon hilang atau ditukar.`, confirmText: 'Batal passkey', danger: true }),
  DISABLE: u => ({ title: 'Nyahaktifkan pengguna?', message: `${u.name} tidak boleh log masuk, merekod kehadiran atau menandatangani. Rekod sedia ada dikekalkan.`, confirmText: 'Nyahaktifkan', danger: true }),
  DELETE: u => ({ title: 'Padam pengguna?', message: `Akaun ${u.name} (${u.id}) akan dipadam dan passkey dibatalkan. Rekod kehadiran & tandatangan lama dikekalkan untuk audit. Tindakan ini tidak boleh dibatalkan.`, confirmText: 'Padam', danger: true })
};
async function userAction(u, op) {
  if (CONFIRMS[op] && !(await confirmDialog(CONFIRMS[op](u)))) return;
  try {
    const r = await authed('adminUserAction', { staffId: u.id, op });
    if (r.link) showLinkModal(u, r.link); else toast(r.message);
    renderPage();
  } catch (e) { toast(e.message, 'err'); }
}

function showLinkModal(u, link) {
  const m = openModal(`${modalHead('Link pendaftaran dihantar', 'Emel telah dihantar kepada ' + u.email)}
    <div class="px-6 py-5"><p class="text-sm text-slate-600">Link ini sekali guna dan juga dihantar melalui emel. Anda boleh menyalinnya untuk dihantar melalui saluran lain (cth. WhatsApp rasmi).</p>
      <div class="mt-4 flex gap-2"><input readonly class="${C.input} font-mono text-xs" value="${esc(link)}" id="lnk">
      ${btn('secondary', ico('copy', 'h-4 w-4'), 'id="cpy" title="Salin"')}</div></div>
    ${modalFoot(btn('primary', 'Selesai', 'data-close'))}`, { size: 'md' });
  m.q('#cpy').onclick = () => navigator.clipboard.writeText(link).then(() => toast('Link disalin')).catch(() => { m.q('#lnk').select(); toast('Tekan Ctrl+C untuk salin', 'err'); });
}

function userForm(u) {
  const isNew = !u; u = u || { id: '', name: '', email: '', dept: '', role: 'STAFF', devices: [], jadual: '', lokasi: '' };
  const roleOpt = (v, t, d) => `<label class="relative flex cursor-pointer rounded-lg p-3 ring-1 ring-inset ring-slate-300 has-[:checked]:bg-indigo-50/60 has-[:checked]:ring-2 has-[:checked]:ring-indigo-600">
      <input type="radio" name="role" value="${v}" class="sr-only" ${u.role === v ? 'checked' : ''}>
      <span><span class="block text-sm font-medium text-slate-900">${t}</span><span class="block text-xs text-slate-500">${d}</span></span></label>`;
  const m = openModal(`${modalHead(isNew ? 'Tambah pengguna' : 'Edit pengguna', isNew ? 'Cipta akaun dan jemput pengguna mendaftar Digital ID' : u.id)}
    <form id="uf" class="space-y-5 px-6 py-5">
      <div class="grid gap-4 sm:grid-cols-2">
        <div><label class="${C.label}">Staff ID</label>${isNew
          ? `<div class="flex h-[42px] items-center gap-2 rounded-lg bg-slate-50 px-3 text-sm text-slate-500 ring-1 ring-inset ring-slate-200">${ico('refresh', 'h-4 w-4')}Dijana automatik</div>`
          : `<input class="${C.input} font-mono" disabled value="${esc(u.id)}">`}</div>
        <div><label class="${C.label}">Jabatan</label><input name="dept" class="${C.input}" value="${esc(u.dept)}" placeholder="cth. Kewangan"></div>
        <div class="sm:col-span-2"><label class="${C.label}">Nama penuh</label><input name="name" class="${C.input}" required value="${esc(u.name)}"></div>
        <div class="sm:col-span-2"><label class="${C.label}">Emel rasmi</label><input name="email" type="email" class="${C.input}" required value="${esc(u.email)}" placeholder="nama@organisasi.gov.my"></div>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div><label class="${C.label}">Jadual kerja</label><select name="jadual" class="${C.input}">
          <option value="">Jadual lalai</option>${(S.scheds || []).filter(j => j.status === 'AKTIF' || j.code === u.jadual).map(j => `<option value="${esc(j.code)}" ${u.jadual === j.code ? 'selected' : ''}>${esc(j.name)}</option>`).join('')}
          <option value="ROSTER" ${u.jadual === 'ROSTER' ? 'selected' : ''}>Ikut roster syif</option></select></div>
        <div><label class="${C.label}">Lokasi pejabat</label><select name="lokasi" class="${C.input}">
          <option value="">Semua lokasi aktif</option>${(S.locs || []).map(l => `<option value="${esc(l.id)}" ${u.lokasi === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></div></div>
      <div><span class="${C.label}">Peranan</span><div class="grid grid-cols-2 gap-3">
        ${roleOpt('STAFF', 'Staf', 'Kehadiran & tandatangan')}${roleOpt('ADMIN', 'Admin', 'Akses penuh portal admin')}</div></div>
      ${isNew ? `<label class="flex items-start gap-3 rounded-lg bg-slate-50 p-3"><input name="sendLink" type="checkbox" checked class="mt-0.5 h-4 w-4 rounded border-slate-300 accent-indigo-600">
        <span class="text-sm"><span class="font-medium text-slate-900">Hantar link pendaftaran sekarang</span><span class="block text-slate-500">Pengguna akan menerima emel untuk mendaftar cap jari pada telefon.</span></span></label>`
      : `<div><span class="${C.label}">Peranti berdaftar</span>${u.devices.length ? `<ul class="divide-y divide-slate-100 rounded-lg ring-1 ring-slate-200">${u.devices.map(d => `
          <li class="flex items-center gap-3 px-3 py-2.5">${ico('phone', 'h-4 w-4 text-slate-400')}<div class="text-sm"><p class="font-medium text-slate-700">${esc(d.label)}</p>
          <p class="text-xs text-slate-500">Didaftar ${esc(d.created.slice(0, 10))}${d.lastUsed ? ' · Terakhir digunakan ' + esc(d.lastUsed.slice(0, 16)) : ''}</p></div></li>`).join('')}</ul>`
        : '<p class="text-sm text-slate-500">Tiada peranti berdaftar.</p>'}</div>`}
      <div id="ufErr" class="hidden rounded-lg bg-rose-50 px-3 py-2.5 text-sm text-rose-700"></div>
    </form>
    ${modalFoot(btn('secondary', 'Batal', 'data-close') + `<button type="submit" form="uf" class="${C.btn} ${C.primary}">${isNew ? 'Cipta pengguna' : 'Simpan perubahan'}</button>`)}`, { size: 'md' });

  m.q('#uf').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const user = { id: u.id, name: f.get('name'), email: f.get('email'), dept: f.get('dept'), role: f.get('role'), jadual: f.get('jadual'), lokasi: f.get('lokasi') };
    busy(m.q('[form=uf]'), async () => {
      try {
        const r = await authed('adminUserSave', { user, isNew, sendLink: isNew && f.get('sendLink') === 'on' });
        m.close();
        if (isNew) toast(`Pengguna dicipta dengan Staff ID ${r.id}`); else toast('Perubahan disimpan');

        if (r.id === S.me.id) S.me.role = user.role;
        renderPage();
      } catch (err) { const el = m.q('#ufErr'); el.textContent = err.message; el.classList.remove('hidden'); }

  };
}

PAGES.docs = async view => {
  const [docs, users] = await Promise.all([authed('adminDocs'), S.users ? Promise.resolve(S.users) : authed('adminUsers')]);
  S.users = users;
  if (!view.set(`${pageHead('Dokumen', `${docs.length} dokumen · ${docs.filter(d => d.status === 'OPEN').length} dibuka untuk tandatangan`,
      btn('primary', ico('plus') + 'Dokumen baharu', 'id="addDoc"'))}
    <div class="mb-4">${searchBox('dq', 'Cari tajuk atau ID dokumen…')}</div><div id="dList"></div>`)) return;

  const draw = () => {
    const q = $('#dq').value.toLowerCase();
    const rows = docs.filter(d => !q || [d.id, d.title].join(' ').toLowerCase().includes(q));
    $('#dList').innerHTML = rows.length ? `<div class="${C.card} divide-y divide-slate-100">${rows.map(d => {
      const pct = d.targetCount ? Math.min(100, Math.round(d.signedCount / d.targetCount * 100)) : 0;
      return `<div class="flex flex-col gap-4 p-5 sm:flex-row sm:items-center">
        <div class="flex min-w-0 flex-1 items-start gap-4">
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-500">${ico('doc')}</span>
          <div class="min-w-0"><p class="flex flex-wrap items-center gap-2 text-sm font-medium text-slate-900">${esc(d.title)} ${badge(d.status)}</p>
            <p class="mt-0.5 text-xs text-slate-500">${esc(d.id)} · ${d.assigned.length ? 'Untuk ' + esc(d.assigned.join(', ')) : 'Semua staf'}${d.fileId ? ' · Fail Drive dilampirkan' : ''}</p></div></div>
        <div class="flex items-center gap-4 sm:w-72">
          <div class="flex-1"><div class="flex justify-between text-xs"><span class="text-slate-500">Ditandatangani</span><span class="font-medium tabular-nums text-slate-700">${d.signedCount} / ${d.targetCount}</span></div>
            <div class="mt-1.5 h-1.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-indigo-500" style="width:${pct}%"></div></div></div>
          <button data-dm="${esc(d.id)}" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Tindakan">${ico('dots')}</button></div></div>`; }).join('')}</div>`
      : `<div class="${C.card}">${emptyState('doc', 'Tiada dokumen', 'Klik “Dokumen baharu” untuk menambah.')}</div>`;
    $$('[data-dm]').forEach(b => b.onclick = e => { e.stopPropagation(); const d = docs.find(x => x.id === b.dataset.dm);
      openMenu(b, [
        { label: 'Edit dokumen', icon: 'edit', onClick: () => docForm(d, users) },
        { label: 'Lihat penandatangan', icon: 'users', onClick: () => signersModal(d) },
        d.fileId ? { label: 'Buka fail Drive', icon: 'link', onClick: () => window.open('https://drive.google.com/file/d/' + d.fileId + '/view', '_blank') } : null,
        '-',
        { label: 'Padam dokumen', icon: 'trash', danger: true, disabled: d.signedCount > 0, onClick: async () => {
          if (!(await confirmDialog({ title: 'Padam dokumen?', message: `“${d.title}” akan dipadam.`, confirmText: 'Padam', danger: true }))) return;
          try { await authed('adminDocDelete', { docId: d.id }); toast('Dokumen dipadam'); renderPage(); } catch (err) { toast(err.message, 'err'); } } }
      ]); });
  };
  $('#dq').oninput = draw; $('#addDoc').onclick = () => docForm(null, users);
  draw();
};

function docForm(d, users) {
  const isNew = !d; d = d || { title: '', fileId: '', assigned: [], status: 'OPEN' };
  const locked = !isNew && d.signedCount > 0;
  const active = users.filter(u => u.status !== 'DISABLED');
  const m = openModal(`${modalHead(isNew ? 'Dokumen baharu' : 'Edit dokumen', isNew ? 'Dokumen yang perlu ditandatangani dengan cap jari' : d.id)}
    <form id="df" class="space-y-5 px-6 py-5">
      ${locked ? `<div class="flex gap-2 rounded-lg bg-amber-50 p-3 text-sm text-amber-800">${ico('shield', 'h-4 w-4 mt-0.5')}Dokumen sudah ditandatangani — tajuk dan fail dikunci supaya hash kekal sah.</div>` : ''}
      <div><label class="${C.label}">Tajuk dokumen</label><input name="title" class="${C.input}" required value="${esc(d.title)}" ${locked ? 'disabled' : ''}></div>
      <div><label class="${C.label}">Link / ID fail Google Drive <span class="font-normal text-slate-400">(pilihan)</span></label>
        <input name="fileId" class="${C.input}" value="${esc(d.fileId)}" placeholder="https://drive.google.com/file/d/…" ${locked ? 'disabled' : ''}>
        <p class="mt-1.5 text-xs text-slate-500">Jika diisi, hash SHA-256 dikira daripada kandungan fail sebenar.</p></div>
      <div><div class="mb-1.5 flex items-center justify-between"><span class="text-sm font-medium text-slate-700">Perlu ditandatangani oleh</span>
          <span id="asgCount" class="text-xs text-slate-500"></span></div>
        <input id="asgQ" class="${C.input} mb-2" placeholder="Cari pengguna…">
        <div id="asgList" class="max-h-48 divide-y divide-slate-100 overflow-y-auto rounded-lg ring-1 ring-slate-200">${active.map(u => `
          <label class="flex cursor-pointer items-center gap-3 px-3 py-2 hover:bg-slate-50" data-n="${esc((u.id + ' ' + u.name).toLowerCase())}">
            <input type="checkbox" value="${esc(u.id)}" class="h-4 w-4 rounded border-slate-300 accent-indigo-600" ${d.assigned.includes(u.id) ? 'checked' : ''}>
            <span class="text-sm text-slate-700">${esc(u.name)} <span class="text-slate-400">· ${esc(u.id)}</span></span></label>`).join('')}</div></div>
      <div><label class="${C.label}">Status</label><select name="status" class="${C.input}">
        <option value="OPEN" ${d.status === 'OPEN' ? 'selected' : ''}>Dibuka — boleh ditandatangani</option>
        <option value="CLOSED" ${d.status === 'CLOSED' ? 'selected' : ''}>Ditutup</option></select></div>
      <div id="dfErr" class="hidden rounded-lg bg-rose-50 px-3 py-2.5 text-sm text-rose-700"></div>
    </form>
    ${modalFoot(btn('secondary', 'Batal', 'data-close') + `<button type="submit" form="df" class="${C.btn} ${C.primary}">${isNew ? 'Cipta dokumen' : 'Simpan perubahan'}</button>`)}`, { size: 'md' });

  const count = () => { const n = $$('#asgList input:checked', m.el).length; m.q('#asgCount').textContent = n ? n + ' dipilih' : 'Tiada dipilih = semua staf'; };
  $$('#asgList input', m.el).forEach(i => i.onchange = count); count();
  m.q('#asgQ').oninput = e => { const q = e.target.value.toLowerCase(); $$('#asgList label', m.el).forEach(l => l.classList.toggle('hidden', !!q && !l.dataset.n.includes(q))); };
  m.q('#df').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const doc = { id: d.id, title: locked ? d.title : f.get('title'), fileId: locked ? d.fileId : f.get('fileId'), status: f.get('status'),
      assigned: $$('#asgList input:checked', m.el).map(i => i.value).join(',') };
    busy(m.q('[form=df]'), async () => {
      try { const r = await authed('adminDocSave', { doc, isNew }); m.close(); toast(isNew ? `Dokumen ${r.id} dicipta` : 'Perubahan disimpan'); renderPage(); }
      catch (err) { const el = m.q('#dfErr'); el.textContent = err.message; el.classList.remove('hidden'); }
    });
  };
}

async function signersModal(d) {
  const m = openModal(`${modalHead('Penandatangan', d.title)}<div id="sg" class="px-6 py-5"><div class="skeleton h-24 rounded-lg"></div></div>
    ${modalFoot(btn('primary', 'Tutup', 'data-close'))}`, { size: 'md' });
  try {
    const list = (await authed('adminSignatures')).filter(s => s.docId === d.id);
    const signedIds = list.map(s => s.staffId);
    const outstanding = (d.assigned.length ? d.assigned : (S.users || []).filter(u => u.status === 'ACTIVE').map(u => u.id)).filter(id => !signedIds.includes(id));
    m.q('#sg').innerHTML = `${list.length ? `<ul class="divide-y divide-slate-100">${list.map(s => `<li class="flex items-center gap-3 py-2.5">${avatar(s.name, 'h-8 w-8 text-[11px]')}
        <div class="min-w-0 flex-1"><p class="text-sm font-medium text-slate-900">${esc(s.name)}</p><p class="text-xs text-slate-500">${esc(s.time)} · ${esc(s.receipt)}</p></div>${badge('SIGNED')}</li>`).join('')}</ul>`
      : '<p class="text-sm text-slate-500">Belum ada tandatangan.</p>'}
      ${outstanding.length ? `<p class="mt-5 text-xs font-semibold uppercase tracking-wide text-slate-400">Belum menandatangani (${outstanding.length})</p>
        <p class="mt-2 text-sm text-slate-600">${esc(outstanding.join(', '))}</p>` : ''}`;
  } catch (e) { m.q('#sg').textContent = e.message; }
}

const monthLabel = m => new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1, 1).toLocaleDateString('ms-MY', { month: 'long', year: 'numeric' });
const shiftMonth = (m, n) => { const d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const tile = (label, value, sub, tone = 'text-slate-900') => `<div class="${C.card} p-4"><p class="text-xs font-medium text-slate-500">${label}</p>
  <p class="mt-1.5 text-2xl font-semibold tabular-nums tracking-tight ${tone}">${value}</p>${sub ? `<p class="mt-0.5 text-xs text-slate-400">${sub}</p>` : ''}</div>`;

      ${tile('Lewat', sm.late, sm.lateMin ? fmtMin(sm.lateMin) + ' keseluruhan' : 'kali', sm.late ? 'text-amber-600' : undefined)}
      ${tile('Pulang awal', sm.early, 'kali', sm.early ? 'text-orange-600' : undefined)}
      ${tile('Tidak hadir', sm.absent, sm.noOut ? sm.noOut + ' tiada rekod keluar' : 'hari', sm.absent ? 'text-rose-600' : undefined)}

      <thead class="bg-slate-50/70"><tr><th class="${C.th}">Tarikh</th><th class="${C.th} hidden md:table-cell">Jadual</th><th class="${C.th}">Masuk</th><th class="${C.th}">Keluar</th>
        <th class="${C.th} hidden sm:table-cell">Jam kerja</th><th class="${C.th}">Status</th></tr></thead>
      <tbody class="divide-y divide-slate-100">${rows.length ? rows.slice().reverse().map(r => {

      btn('secondary', ico('refresh', 'h-4 w-4'), 'id="bRef" title="Muat semula"') + btn('secondary', ico('download', 'h-4 w-4') + 'CSV', 'id="bCsv"'))}
    ${tabs}

      ${tile('Dijangka hadir', c.expected, `${c.total} staf aktif`)}
      ${tile('Hadir', c.present, c.expected ? Math.round(c.present / c.expected * 100) + '% daripada dijangka' : '', 'text-emerald-600')}
      ${tile('Lewat', c.late, '', c.late ? 'text-amber-600' : undefined)}
      ${tile('Tidak hadir', c.absent, c.notYet ? c.notYet + ' belum masuk' : '', c.absent ? 'text-rose-600' : undefined)}
      ${tile('Pulang awal', c.early, c.noOut ? c.noOut + ' tiada rekod keluar' : '', c.early ? 'text-orange-600' : undefined)}
      ${tile('Tugas luar', c.outstation, '', c.outstation ? 'text-violet-600' : undefined)}</div>
    <div class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-center">
      <div class="flex flex-wrap gap-1.5">${FILTERS.map(([k, l]) => `<button data-f="${k}" class="rounded-full px-3 py-1.5 text-xs font-medium ring-1 ring-inset ${S.boardFilter === k ? 'bg-indigo-600 text-white ring-indigo-600' : 'bg-white text-slate-600 ring-slate-300 hover:bg-slate-50'}">${l}</button>`).join('')}</div>
      <div class="lg:ml-auto lg:w-72">${searchBox('bq', 'Cari nama / bahagian…')}</div></div>
    <div class="${C.card} relative overflow-hidden"><div class="relative overflow-x-auto"><table class="min-w-full divide-y divide-slate-100">
      <thead class="bg-slate-50/70"><tr><th class="${C.th}">Staf</th><th class="${C.th} hidden lg:table-cell">Jadual</th><th class="${C.th}">Masuk</th><th class="${C.th}">Keluar</th>
        <th class="${C.th} hidden sm:table-cell">Jam</th><th class="${C.th}">Status</th><th class="${C.th} hidden md:table-cell">Lokasi</th></tr></thead>
      <tbody id="bRows" class="divide-y divide-slate-100"></tbody></table></div></div>`)) return;
  bindTabs();
  const match = r => { const f = S.boardFilter; if (!f) return true; if (f === 'IN') return !!r.in; if (f === 'LUAR') return r.outstation; return r.status === f || r.flags.includes(f); };
  const draw = () => {
    const q = $('#bq').value.toLowerCase();
    const rows = d.rows.filter(r => match(r) && (!q || [r.name, r.staffId, r.dept].join(' ').toLowerCase().includes(q)));
    $('#bRows').innerHTML = rows.length ? rows.map(r => `<tr>
      <td class="${C.td}"><p class="font-medium text-slate-900">${esc(r.name)}</p><p class="text-xs text-slate-500">${esc(r.staffId)}${r.dept ? ' · ' + esc(r.dept) : ''}</p></td>
      <td class="${C.td} hidden text-slate-500 lg:table-cell"><p>${esc(r.schedLabel)}</p><p class="text-xs text-slate-400">${esc(r.schedText)}</p></td>
      <td class="${C.td} tabular-nums">${esc(r.in || '—')}${r.late ? `<span class="block text-xs text-amber-600">+${fmtMin(r.late)}</span>` : ''}</td>
      <td class="${C.td} tabular-nums">${esc(r.out || '—')}${r.outNextDay ? '<sup class="text-slate-400">+1</sup>' : ''}${r.early ? `<span class="block text-xs text-orange-600">−${fmtMin(r.early)}</span>` : ''}</td>
      <td class="${C.td} hidden tabular-nums text-slate-600 sm:table-cell">${r.worked ? fmtMin(r.worked) : '—'}</td>

  };
  $$('[data-f]').forEach(b => b.onclick = () => { S.boardFilter = b.dataset.f; renderPage(); });
  $('#bq').oninput = draw; draw();
  $('#bDate').onchange = e => { S.boardDate = e.target.value || todayKL(); renderPage(); };
  $('#bRef').onclick = () => renderPage();
  $('#bCsv').onclick = () => downloadCsv(`kehadiran_harian_${d.date}.csv`, [['Tarikh', 'StaffID', 'Nama', 'Bahagian', 'Jadual', 'Masuk', 'Keluar', 'Lewat (min)', 'Pulang awal (min)', 'Jam kerja (min)', 'Status', 'Tugas luar', 'Lokasi'],
    ...d.rows.map(r => [d.date, r.staffId, r.name, r.dept, r.schedLabel, r.in, r.out, r.late, r.early, r.worked, r.status, r.outstation ? 'Ya' : '', r.where])]);
}

const DAY_NAMES = ['Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab', 'Ahd'];

function formError(m, id, err) { const el = m.q('#' + id); el.textContent = err.message; el.classList.remove('hidden'); }

function locForm(l) {
  const isNew = !l; l = l || { name: '', lat: '', lng: '', radius: 150, status: 'AKTIF' };
  const m = openModal(`${modalHead(isNew ? 'Tambah lokasi' : 'Edit lokasi', 'Titik tengah pejabat dan radius yang dibenarkan')}
    <form id="lf" class="space-y-4 px-6 py-5">
      <div><label class="${C.label}">Nama lokasi</label><input name="name" class="${C.input}" required value="${esc(l.name)}" placeholder="cth. Ibu Pejabat, Aras 5"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="${C.label}">Latitud</label><input name="lat" class="${C.input} font-mono" required value="${esc(l.lat)}" placeholder="3.139003"></div>
        <div><label class="${C.label}">Longitud</label><input name="lng" class="${C.input} font-mono" required value="${esc(l.lng)}" placeholder="101.686855"></div></div>
      <div class="flex flex-wrap items-center gap-2">${btn('secondary', ico('pin', 'h-4 w-4') + 'Guna lokasi saya sekarang', 'id="useHere"')}
        <a id="mapLink" target="_blank" rel="noopener" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Semak di peta →</a></div>
      <p class="text-xs text-slate-500">Petua: dalam Google Maps, klik kanan pada bangunan pejabat → klik koordinat untuk salin, kemudian tampal ke ruangan Latitud (kedua-dua nilai akan diisi).</p>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="${C.label}">Radius (meter)</label><input name="radius" type="number" min="20" max="5000" class="${C.input}" required value="${esc(l.radius)}"></div>
        <div><label class="${C.label}">Status</label><select name="status" class="${C.input}"><option value="AKTIF">Aktif</option><option value="TIDAK_AKTIF" ${l.status === 'TIDAK_AKTIF' ? 'selected' : ''}>Tidak aktif</option></select></div></div>
      <div id="lfErr" class="hidden rounded-lg bg-rose-50 px-3 py-2.5 text-sm text-rose-700"></div></form>
    ${modalFoot(btn('secondary', 'Batal', 'data-close') + `<button type="submit" form="lf" class="${C.btn} ${C.primary}">Simpan lokasi</button>`)}`);
  const f = m.q('#lf'), lat = f.elements.lat, lng = f.elements.lng;
  const sync = () => { m.q('#mapLink').href = `https://maps.google.com/?q=${encodeURIComponent(lat.value)},${encodeURIComponent(lng.value)}`; };
  lat.oninput = () => { const p = lat.value.split(/[,\s]+/).filter(Boolean); if (p.length === 2) { lat.value = p[0]; lng.value = p[1]; } sync(); };
  lng.oninput = sync; sync();
  m.q('#useHere').onclick = e => busy(e.currentTarget, async () => {
    const g = await getGeoFix();
    if (g.geoError) return formError(m, 'lfErr', new Error(g.geoError));
    lat.value = g.lat.toFixed(6); lng.value = g.lng.toFixed(6); sync();
    toast(`Lokasi semasa diisi (ketepatan ±${Math.round(g.acc)} m)`);
  });
  f.onsubmit = e => { e.preventDefault(); const d = new FormData(f);
    busy(m.q('[form=lf]'), async () => {
      try { await authed('adminLocationSave', { isNew, loc: { id: l.id, name: d.get('name'), lat: d.get('lat'), lng: d.get('lng'), radius: d.get('radius'), status: d.get('status') } });
        m.close(); toast('Lokasi disimpan'); renderPage(); } catch (err) { formError(m, 'lfErr', err); }
    }); };
}

  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ═══════════ LOG MASUK PANTAS: terus ke cap jari tanpa skrin tambahan ═══════════ */
const FAST = { start: null, at: 0, timer: null };
const fastMe = () => { try { return JSON.parse(localStorage.getItem('fastLogin') || 'null'); } catch (e) { return null; } };

/** Ambil cabaran awal-awal supaya bila butang ditekan, cap jari boleh terus diminta */
async function prefetchLogin() {
  try { FAST.start = await api('authStart', { purpose: 'LOGIN' }); FAST.at = Date.now(); } catch (e) { FAST.start = null; }
}

function setupFastLogin() {
  const btnEl = $('#fpBtn'), hint = btnEl.nextElementSibling, me = fastMe();
  if (me) hint.innerHTML = `Log masuk sebagai <b class="text-slate-600">${esc(me.name)}</b> · <button type="button" id="notMe" class="font-medium text-indigo-600 hover:text-indigo-500">Bukan anda?</button>`;
  const nm = $('#notMe');
  if (nm) nm.onclick = () => { try { localStorage.removeItem('fastLogin'); } catch (e) {} renderLogin(); };
  prefetchLogin();
  clearInterval(FAST.timer);   // cabaran tamat dalam 5 minit → ambil baharu setiap 4 minit
  FAST.timer = setInterval(() => { if (!$('#fpBtn')) return clearInterval(FAST.timer); prefetchLogin(); }, 240000);
  btnEl.onclick = () => fastLogin(btnEl);
}

async function fastLogin(btnEl) {
  showAlert('lgMsg');
  const st = FAST.start;
  if (!st || Date.now() - FAST.at > 270000) { prefetchLogin(); return doLogin({}, btnEl); }   // sandaran: cara biasa
  FAST.start = null;
  const me = fastMe();
  let a;
  try {   // dipanggil terus dari klik → telefon terus minta cap jari
    a = await navigator.credentials.get({ publicKey: {
      challenge: b64u.dec(st.publicKey.challenge), rpId: st.publicKey.rpId, timeout: 60000, userVerification: 'required',
      // Jika peranti ini ingat passkey anda → terus cap jari. Jika belum → telefon tunjuk senarai (sekali sahaja)
      allowCredentials: me ? [{ type: 'public-key', id: b64u.dec(me.credId) }] : []
    }});
  } catch (e) {
    prefetchLogin();
    return showAlert('lgMsg', webauthnError(e) + (me ? ' Jika passkey telah dipadam dari telefon, klik "Bukan anda?".' : ''));
  }
  busy(btnEl, async () => {
    try {
      const out = await api('authFinish', { challengeId: st.challengeId, credential: {
        id: a.id, clientDataJSON: b64u.enc(a.response.clientDataJSON),
        authenticatorData: b64u.enc(a.response.authenticatorData), signature: b64u.enc(a.response.signature) } });
      try { localStorage.setItem('fastLogin', JSON.stringify({ credId: a.id, name: out.staff.name })); } catch (e) {}
      finishLogin(out);
    } catch (e) {
      if (/tidak dikenali|tidak aktif/.test(e.message)) { try { localStorage.removeItem('fastLogin'); } catch (x) {} }
      prefetchLogin(); showAlert('lgMsg', e.message);
    }
  });
}

/* ═══════════ ENJIN WAJAH (Human, dimuat hanya bila diperlukan) ═══════════ */
const HUMAN_URL = window.HUMAN_BASE || 'https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6';
const MATCH_OPTS = { order: 2, multiplier: 25, min: 0.2, max: 0.8 };   // tetapan rasmi untuk model faceres
let humanP = null;
function loadHuman() {
  if (!humanP) humanP = (async () => {
    const H = await import(HUMAN_URL + '/dist/human.esm.js');
    const human = new H.Human({
      modelBasePath: HUMAN_URL + '/models/', backend: 'webgl', debug: false, cacheSensitivity: 0,
      filter: { enabled: true, flip: false },
      face: { enabled: true, detector: { rotation: true, maxDetected: 10, minConfidence: 0.5, return: false },
        mesh: { enabled: true }, iris: { enabled: false }, emotion: { enabled: false }, attention: { enabled: false },
        description: { enabled: true }, antispoof: { enabled: true }, liveness: { enabled: true } },
      body: { enabled: false }, hand: { enabled: false }, object: { enabled: false }, gesture: { enabled: false }, segmentation: { enabled: false }
    });
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('tamat masa (semak sambungan internet / CDN jsdelivr tidak disekat)')), 90000));
    await Promise.race([human.load(), timeout]);
    const need = ['blazeface', 'facemesh', 'faceres'], have = human.models.loaded().join(' ');
    const miss = need.filter(n => !have.includes(n));
    if (miss.length) throw new Error('model tidak dapat dimuat turun: ' + miss.join(', ') + '. Pastikan cdn.jsdelivr.net tidak disekat oleh rangkaian.');
    await Promise.race([human.warmup(), timeout]);
    return human;
  })().catch(e => { humanP = null; throw new Error('Gagal memuat model pengecaman wajah: ' + e.message); });
  return humanP;
}
const encDesc = d => b64u.enc(new Float32Array(d).buffer);
const decDesc = s => Array.from(new Float32Array(b64u.dec(s)));
const validFaces = res => (res.face || []).filter(f => f.embedding && f.embedding.length === 1024);

async function openCamera(video, deviceId, facing = 'user') {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const constraints = { audio: false, video: deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
    : { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } } };
  try { video.srcObject = await navigator.mediaDevices.getUserMedia(constraints); }
  catch (e) { throw new Error(e.name === 'NotAllowedError' ? 'Akses kamera ditolak. Benarkan kamera pada browser.' : 'Kamera tidak dapat dibuka: ' + e.message); }
  await video.play();
  await new Promise(r => video.videoWidth ? r() : video.onloadedmetadata = r);
}
function stopCamera(video) { if (video && video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; } }

function enrollFace() {
  const N = 3;
  const m = openModal(`${modalHead('Daftar wajah', 'Pandang kamera. Sampel diambil secara automatik.')}
    <div class="px-6 py-5">
      <div class="relative mx-auto aspect-square w-full max-w-xs overflow-hidden rounded-full bg-slate-900 ring-4 ring-slate-100" id="ringBox">
        <video id="ev" playsinline muted class="h-full w-full object-cover [transform:scaleX(-1)]"></video>
        <div id="evMsg" class="absolute inset-x-0 bottom-4 mx-auto w-max max-w-[90%] rounded-full bg-black/60 px-3 py-1 text-center text-xs text-white">Memuat model…</div></div>
      <div class="mt-5 flex justify-center gap-2" id="dots">${Array.from({ length: N }, () => '<span class="h-2.5 w-8 rounded-full bg-slate-200"></span>').join('')}</div>
      <div id="efErr" class="mt-4 hidden rounded-lg bg-rose-50 px-3 py-2.5 text-sm text-rose-700"></div></div>
    ${modalFoot(btn('secondary', 'Batal', 'data-close'))}`, { size: 'sm', onClose: () => { done = true; stopCamera(m.q('#ev')); } });
  let done = false;
  const msg = t => { m.q('#evMsg').textContent = t; };
  (async () => {
    try {
      const human = await loadHuman();
      const video = m.q('#ev');
      await openCamera(video, null, 'user');
      const samples = []; let lastAt = 0;
      while (!done && samples.length < N) {
        const res = await human.detect(video);
        const faces = validFaces(res);
        const vw = video.videoWidth;
        if (!faces.length) msg('Wajah tidak dikesan');
        else if (faces.length > 1) msg('Hanya seorang di hadapan kamera');
        else if (faces[0].box[2] < vw * 0.2) msg('Dekatkan wajah ke kamera');
        else if (Math.abs((faces[0].rotation && faces[0].rotation.angle.yaw) || 0) > 0.35) msg('Pandang terus ke kamera');
        else if (Date.now() - lastAt > 700) {
          samples.push({ d: encDesc(faces[0].embedding), q: Math.round(((faces[0].real || 0) + (faces[0].live || 0)) * 50) });
          lastAt = Date.now();
          $$('#dots span', m.el).forEach((d, i) => d.className = 'h-2.5 w-8 rounded-full ' + (i < samples.length ? 'bg-emerald-500' : 'bg-slate-200'));
          msg(samples.length < N ? 'Bagus! Gerakkan kepala sedikit…' : 'Selesai');
        }
        await new Promise(r => setTimeout(r, 60));
      }
      if (done) return;
      stopCamera(video);
      m.q('#ringBox').classList.replace('ring-slate-100', 'ring-emerald-200');
      msg('Menyimpan…');
      await authed('faceEnroll', { consent: true, descriptors: samples.map(s => s.d), quality: Math.round(samples.reduce((a, s) => a + s.q, 0) / N) });
      done = true; m.close(); toast('Wajah anda telah didaftarkan'); renderPage();
    } catch (e) { stopCamera(m.q('#ev')); const el = m.q('#efErr'); el.textContent = e.message; el.classList.remove('hidden'); msg('Ralat'); }
  })();
}

/** Import gambar pasport: diproses dalam browser, hanya embedding dihantar */
function passportImport(faces) {
  const byKey = {};
  faces.forEach(f => { byKey[f.id.toLowerCase()] = f; if (f.email) { byKey[f.email.toLowerCase()] = f; byKey[f.email.toLowerCase().split('@')[0]] = byKey[f.email.toLowerCase().split('@')[0]] || f; } });
  const m = openModal(`${modalHead('Import gambar pasport', 'Gambar diproses dalam browser ini. Gambar tidak dimuat naik.')}
    <div class="space-y-4 px-6 py-5">
      <div class="rounded-xl bg-slate-50 p-4 text-sm text-slate-600 ring-1 ring-slate-200/70">
        <p class="font-medium text-slate-900">Nama fail mesti sepadan dengan staf</p>
        <p class="mt-1">Gunakan <b>Staff ID</b> atau <b>emel</b> sebagai nama fail, contohnya <code class="rounded bg-white px-1">S0002.jpg</code> atau <code class="rounded bg-white px-1">aina@agensi.gov.my.jpg</code>. Format JPG / PNG, satu wajah setiap gambar.</p></div>
      <div class="flex flex-wrap gap-2">
        <label class="${C.btn} ${C.secondary} cursor-pointer">${ico('doc', 'h-4 w-4')}Pilih fail<input id="pf" type="file" accept="image/jpeg,image/png" multiple class="sr-only"></label>
        <label class="${C.btn} ${C.secondary} cursor-pointer">${ico('download', 'h-4 w-4')}Pilih folder<input id="pd" type="file" webkitdirectory multiple class="sr-only"></label></div>
      <div id="pList" class="max-h-64 divide-y divide-slate-100 overflow-y-auto rounded-lg ring-1 ring-slate-200 empty:hidden"></div>
      <p id="pSum" class="text-sm text-slate-500"></p>
      <label class="flex items-start gap-3 rounded-lg bg-amber-50 p-3"><input id="attest" type="checkbox" class="mt-0.5 h-4 w-4 rounded border-slate-300 accent-indigo-600">
        <span class="text-sm text-amber-900"><b>Saya mengesahkan persetujuan bertulis</b> staf berkenaan telah diperoleh. Jika tidak ditanda, setiap staf perlu menekan "Saya bersetuju" di halaman Wajah Saya sebelum templat digunakan.</span></label>
      <div id="piErr" class="hidden rounded-lg bg-rose-50 px-3 py-2.5 text-sm text-rose-700"></div></div>
    ${modalFoot(btn('secondary', 'Tutup', 'data-close') + btn('primary', 'Simpan templat', 'id="pSave" disabled'))}`, { size: 'lg' });

  let items = [];
  const row = (name, staff, state, tone) => `<div class="flex items-center gap-3 px-3 py-2 text-sm"><span class="min-w-0 flex-1 truncate font-mono text-xs text-slate-600">${esc(name)}</span>
    <span class="hidden w-40 truncate text-slate-700 sm:block">${staff ? esc(staff.name) : '—'}</span><span class="w-44 text-right text-xs ${tone}">${esc(state)}</span></div>`;
  const handle = async files => {
    files = [...files].filter(f => /\.(jpe?g|png)$/i.test(f.name));
    if (!files.length) return;
    items = []; m.q('#pSave').disabled = true;
    const list = m.q('#pList'); list.innerHTML = files.map(f => row(f.name, null, 'Menunggu…', 'text-slate-400')).join('');
    let human;
    try { m.q('#pSum').textContent = 'Memuat model pengecaman wajah…'; human = await loadHuman(); }
    catch (e) { return formError(m, 'piErr', e); }
    let ok = 0;
    for (let i = 0; i < files.length; i++) {
      const f = files[i], key = f.name.replace(/\.(jpe?g|png)$/i, '').trim().toLowerCase();
      const staff = byKey[key];
      let state = '', tone = 'text-rose-600';
      if (!staff) state = 'Staf tidak dijumpai';
      else {
        try {
          const bmp = await createImageBitmap(f);
          const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height; cv.getContext('2d').drawImage(bmp, 0, 0);
          const fcs = validFaces(await human.detect(cv));
          if (!fcs.length) state = 'Wajah tidak dikesan';
          else if (fcs.length > 1) state = fcs.length + ' wajah — perlu satu sahaja';
          else if (fcs[0].box[2] < 80) state = 'Wajah terlalu kecil';
          else { items.push({ staffId: staff.id, descriptor: encDesc(fcs[0].embedding), quality: Math.round(fcs[0].score * 100) }); state = 'Sedia'; tone = 'text-emerald-600'; ok++; }
        } catch (e) { state = 'Gagal dibaca'; }
      }
      list.children[i].outerHTML = row(f.name, staff, state, tone);
      m.q('#pSum').textContent = `Diproses ${i + 1} / ${files.length} · ${ok} sedia`;
    }
    m.q('#pSave').disabled = !items.length;
  };
  m.q('#pf').onchange = e => handle(e.target.files);
  m.q('#pd').onchange = e => handle(e.target.files);
  m.q('#pSave').onclick = e => busy(e.currentTarget, async () => {
    try {
      let saved = 0;
      for (let i = 0; i < items.length; i += 25) {
        const r = await authed('adminFaceImport', { items: items.slice(i, i + 25), attested: m.q('#attest').checked });
        saved += r.results.filter(x => x.ok).length;
      }
      m.close(); toast(`${saved} templat pasport disimpan${m.q('#attest').checked ? '' : ' (menunggu persetujuan staf)'}`); renderPage();
    } catch (err) { formError(m, 'piErr', err); }
  });
}

/* ═══════════ MOD KIOSK (skrin penuh, pelbagai wajah) ═══════════ */
const K = { token: null, running: false, people: [], db: [], cfg: {}, hits: {}, sent: {}, recent: [], human: null, mirror: true, refreshAt: 0, info: null };

function renderKiosk() {

const kStatus = t => { const el = $('#kStatus'); if (el) el.textContent = t; };

async function kioskRefresh() {
  const d = await api('kioskInit', { kioskToken: K.token });
  K.info = d.kiosk; K.cfg = d.cfg; K.people = d.people; K.refreshAt = Date.now();
  K.db = []; d.people.forEach(p => p.descs.forEach(s => K.db.push({ staffId: p.staffId, name: p.name, desc: decDesc(s) })));
  $('#kName span').textContent = d.kiosk.name + (d.kiosk.location ? ' · ' + d.kiosk.location : '');
  $('#kFoot').textContent = `${d.people.length} staf berdaftar wajah · dikemas kini ${d.now.slice(11, 16)}`;
}

async function startKiosk() {
  try {
    kStatus('Menyambung ke pelayan…'); await kioskRefresh();
    kStatus('Memuat model pengecaman wajah…'); K.human = await loadHuman();
    kStatus('Membuka kamera…'); await openCamera($('#kv'), store.get('kioskCam'));
    K.mirror = store.get('kioskMirror') !== '0';
    $('#kv').style.transform = K.mirror ? 'scaleX(-1)' : '';
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
    K.running = true; kStatus('Sedia — sila hadap kamera'); kioskLoop();
  } catch (e) {
    kStatus('Ralat');
    $('#kToast').innerHTML = `<div class="pointer-events-auto max-w-md rounded-2xl bg-rose-600 px-6 py-4 text-center shadow-xl"><p class="font-semibold">Kiosk tidak dapat dimulakan</p><p class="mt-1 text-sm text-rose-100">${esc(e.message)}</p>
      <button onclick="location.reload()" class="mt-3 rounded-lg bg-white/20 px-4 py-2 text-sm font-semibold hover:bg-white/30">Cuba lagi</button></div>`;
  }
}

function matchFace(emb) {
  let best = null, second = 0;
  const perStaff = {};
  for (const r of K.db) {
    const s = K.human.match.similarity(emb, r.desc, MATCH_OPTS);
    if (!perStaff[r.staffId] || s > perStaff[r.staffId].s) perStaff[r.staffId] = { s, r };
  }
  Object.values(perStaff).forEach(x => { if (!best || x.s > best.s) { if (best) second = Math.max(second, best.s); best = x; } else second = Math.max(second, x.s); });
  if (!best || best.s < K.cfg.threshold || best.s - second < 0.05) return null;
  return { staffId: best.r.staffId, name: best.r.name, score: best.s };
}

async function kioskLoop() {
  if (!K.running) return;
  const video = $('#kv'), cv = $('#kc');
  if (!video) { K.running = false; return; }
  if (Date.now() - K.refreshAt > 10 * 60000) kioskRefresh().catch(() => {});
  const t0 = Date.now();
  try {
    const res = await K.human.detect(video);
    K.frameMs = K.frameMs ? 0.7 * K.frameMs + 0.3 * (Date.now() - t0) : Date.now() - t0;   // kelajuan peranti
    const W = video.videoWidth, Hh = video.videoHeight;
    if (cv.width !== W) { cv.width = W; cv.height = Hh; }
    const g = cv.getContext('2d'); g.clearRect(0, 0, W, Hh);
    const now = Date.now(), faces = validFaces(res);
    kStatus(faces.length ? `${faces.length} wajah dikesan` : 'Sedia — sila hadap kamera');
    for (const f of faces) {
      let [x, y, w, h] = f.box;
      const edge = x <= 2 || y <= 2 || x + w >= W - 2 || y + h >= Hh - 2;   // wajah terpotong → embedding kurang tepat
      if (K.mirror) x = W - x - w;
      let label = 'Tidak dikenali', color = '#94a3b8';
      const spoof = K.cfg.antispoofMin > 0 && Math.min(f.real || 0, f.live || 0) < K.cfg.antispoofMin;
      if (w < 70) { label = 'Sila dekat'; }
      else if (edge) { label = 'Ke tengah sedikit'; }
      else if (spoof) { label = 'Hadap kamera secara langsung'; color = '#f59e0b'; }
      else {
        const mt = matchFace(f.embedding);
        if (mt) {
          // Sah selepas 2 bingkai berturut-turut (tetingkap ikut kelajuan peranti)
          const win = Math.max(5000, (K.frameMs || 0) * 2.5);
          const hit = K.hits[mt.staffId] = (K.hits[mt.staffId] && now - K.hits[mt.staffId].t < win) ? { n: K.hits[mt.staffId].n + 1, t: now } : { n: 1, t: now };
          const last = K.sent[mt.staffId];
          if (last && now - last.t < (K.cfg.cooldownMin || 5) * 60000) { label = mt.name + (last.label ? ' · ' + last.label : ''); color = '#10b981'; }
          else if (hit.n >= 2) { label = mt.name; color = '#10b981'; kioskSend(mt, f.embedding); }
          else { label = 'Mengesahkan…'; color = '#f59e0b'; }
        }
      }
      g.lineWidth = Math.max(3, W / 300); g.strokeStyle = color;
      g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, 16) : g.rect(x, y, w, h); g.stroke();
      g.font = `600 ${Math.max(16, Math.round(W / 55))}px Inter, system-ui, sans-serif`;
      const tw = g.measureText(label).width + 20, th = Math.max(28, Math.round(W / 38));
      const lx = Math.min(Math.max(x + (w - tw) / 2, 4), W - tw - 4), ly = Math.min(y + h - th - 10, Hh - th - 4);   // label di bawah, dalam kotak
      g.fillStyle = color; g.beginPath(); g.roundRect ? g.roundRect(lx, ly, tw, th, 8) : g.rect(lx, ly, tw, th); g.fill();
      g.fillStyle = '#fff'; g.fillText(label, lx + 10, ly + th * 0.68);
    }
  } catch (e) { /* teruskan gelung */ }
  setTimeout(kioskLoop, 40);
}

const STATUS_TXT = { LEWAT: 'Lewat', PULANG_AWAL: 'Pulang awal', HADIR: 'Hadir', BEKERJA: 'Selamat bekerja' };
async function kioskSend(mt, emb) {
  K.sent[mt.staffId] = { t: Date.now(), label: '…' };
  try {
    const r = await api('kioskPunch', { kioskToken: K.token, staffId: mt.staffId, descriptor: encDesc(emb) });
    if (r.action === 'REJECT') { delete K.sent[mt.staffId]; return; }
    if (r.action === 'SKIP') { K.sent[mt.staffId].label = r.reason; return; }
    const act = r.action === 'IN' ? 'Masuk' : 'Keluar';
    K.sent[mt.staffId].label = act + ' ' + r.time;
    const extra = r.action === 'IN' ? (r.late ? `Lewat ${fmtMin(r.late)}` : 'Selamat bekerja') : (r.early ? `Pulang awal ${fmtMin(r.early)}` : 'Terima kasih');
    K.recent.unshift({ name: r.name, act, time: r.time, extra, warn: !!(r.late || r.early) });
    K.recent = K.recent.slice(0, 12);
    $('#kRecent').innerHTML = K.recent.map(x => `<li class="flex items-center gap-3 rounded-xl bg-white/5 px-3 py-2.5">
      <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-indigo-500/20 text-xs font-semibold text-indigo-200">${esc(initials(x.name))}</span>
      <div class="min-w-0 flex-1"><p class="truncate text-sm font-medium">${esc(x.name)}</p><p class="text-xs ${x.warn ? 'text-amber-300' : 'text-slate-400'}">${esc(x.extra)}</p></div>
      <div class="text-right"><p class="text-xs font-semibold ${x.act === 'Masuk' ? 'text-emerald-300' : 'text-sky-300'}">${x.act}</p><p class="text-sm tabular-nums text-slate-300">${esc(x.time)}</p></div></li>`).join('');
    $('#kToast').innerHTML = `<div class="flex items-center gap-4 rounded-2xl bg-emerald-600 px-6 py-4 shadow-2xl">
      <span class="flex h-12 w-12 items-center justify-center rounded-full bg-white/20">${ico('check', 'h-7 w-7')}</span>
      <div><p class="text-xl font-semibold">${esc(r.name)}</p><p class="text-emerald-100">Daftar ${act} · ${esc(r.time)} · ${esc(extra)}</p></div></div>`;
    clearTimeout(K.toastT); K.toastT = setTimeout(() => { const t = $('#kToast'); if (t) t.innerHTML = ''; }, 3500);
    try { const ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), gn = ac.createGain();
      o.frequency.value = r.action === 'IN' ? 880 : 660; gn.gain.value = 0.08; o.connect(gn).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.15); } catch (e) {}
  } catch (e) { delete K.sent[mt.staffId]; kStatus('Ralat rangkaian — cuba semula'); }
}

async function kioskSettings() {
  let cams = [];
  try { cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput'); } catch (e) {}
  const cur = store.get('kioskCam') || '';
  const m = openModal(`${modalHead('Tetapan kiosk', K.info ? K.info.name : '')}
    <div class="space-y-4 px-6 py-5 text-slate-800">
      <div><label class="${C.label}">Kamera</label><select id="ksCam" class="${C.input}"><option value="">Lalai</option>
        ${cams.map((c, i) => `<option value="${esc(c.deviceId)}" ${c.deviceId === cur ? 'selected' : ''}>${esc(c.label || 'Kamera ' + (i + 1))}</option>`).join('')}</select></div>
      <label class="flex items-center gap-3"><input id="ksMir" type="checkbox" class="h-4 w-4 accent-indigo-600" ${K.mirror ? 'checked' : ''}><span class="text-sm">Paparan cermin (mirror)</span></label>
      <div class="border-t border-slate-100 pt-4"><button id="ksExit" class="text-sm font-medium text-rose-600 hover:text-rose-500">Keluar mod kiosk pada peranti ini</button></div></div>
    ${modalFoot(btn('secondary', 'Tutup', 'data-close') + btn('primary', 'Simpan', 'id="ksSave"'))}`, { size: 'sm' });
  m.q('#ksSave').onclick = () => { store.set('kioskCam', m.q('#ksCam').value); store.set('kioskMirror', m.q('#ksMir').checked ? '1' : '0'); location.reload(); };
  m.q('#ksExit').onclick = async () => {
    if (!(await confirmDialog({ title: 'Keluar mod kiosk?', message: 'Peranti ini perlu dibuka semula dengan link aktivasi untuk menjadi kiosk.', confirmText: 'Keluar', danger: true }))) return;
    store.del('kioskToken'); location.href = location.pathname;
  };
}

/* ═══════════ Permulaan ═══════════ */
(async function boot() {
  // Mod kiosk: ?kiosk=<token> (aktivasi) atau ?kiosk (peranti yang sudah diaktifkan)
  const qs = new URLSearchParams(location.search);
  if (qs.has('kiosk')) {
    if (qs.get('kiosk')) { store.set('kioskToken', qs.get('kiosk')); history.replaceState(null, '', location.pathname + '?kiosk'); }
    K.token = store.get('kioskToken');
    if (K.token) return renderKiosk();
  } else if (store.get('kioskToken') && !regToken) {
    history.replaceState(null, '', location.pathname + '?kiosk'); K.token = store.get('kioskToken'); return renderKiosk();
  }
  if (!window.PublicKeyCredential) return renderUnsupported();
  try { S.cfg = await api('publicConfig'); } catch (e) { /* teruskan tanpa SSO */ }
  if (regToken) {   // pendaftaran mesti pada telefon yang ada cap jari / Face ID
    const platform = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(() => false);
    return platform ? renderRegister() : renderUnsupported();
  }
  if (S.token) {
    try { S.me = (await api('me', { sessionToken: S.token })).staff; return renderShell(); }
    catch (e) { store.del('session', true); S.token = null; }
  }
  renderLogin();
})();
</script>
